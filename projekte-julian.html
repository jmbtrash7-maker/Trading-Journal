<!-- Sichtbare Fehleranzeige: greift JEDEN Fehler ab (Script-Ladefehler, JS-Fehler, verworfene
     Promises) und zeigt ihn direkt auf der Seite an, statt dass nur ein leerer schwarzer
     Bildschirm übrig bleibt. Läuft VOR dem eigentlichen React-Code, damit auch Fehler beim
     Laden von React/Babel/Icons selbst abgefangen werden. -->
<script>
  function showBootError(msg){
    var el = document.getElementById('boot-status');
    if(!el) return;
    el.classList.add('error');
    el.innerHTML = '⚠ Beim Laden ist ein Fehler aufgetreten:<br><pre></pre><div style="margin-top:6px;">Bitte diesen Text an Claude schicken.</div>';
    el.querySelector('pre').textContent = msg;
  }
  window.addEventListener('error', function(e){ showBootError(e.message + (e.filename ? ('\n' + e.filename + ':' + e.lineno) : '')); });
  window.addEventListener('unhandledrejection', function(e){ showBootError(String(e.reason && e.reason.stack || e.reason)); });
  // Falls nach 8 Sekunden immer noch nichts gerendert wurde (z.B. weil ein <script>-Tag von
  // einem CDN blockiert/geblockt wurde, ohne dass ein JS-Fehler ausgelöst wurde): auch das
  // sichtbar machen, statt stumm schwarz zu bleiben.
  setTimeout(function(){
    if(!window.__projekteMounted){
      showBootError('Timeout: Die Seite hat nach 8 Sekunden nicht geladen. Vermutlich konnte eine externe Ressource (Tailwind/Babel/React/Icons von einem CDN) nicht geladen werden — z.B. durch Internet-Filter, Adblocker oder fehlenden Internetzugriff.');
    }
  }, 8000);
</script>

/* ============================================================
   DATUMS-HILFSFUNKTIONEN
   ============================================================ */
function addDays(base, n) {
  const d = new Date(base);
  d.setDate(d.getDate() + n);
  return d;
}
function isoDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function parseIso(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function relativeDateLabel(iso) {
  const today = startOfDay(new Date());
  const target = startOfDay(parseIso(iso));
  const diffDays = Math.round((target - today) / 86400000);
  if (diffDays === 0) return "Heute";
  if (diffDays === 1) return "Morgen";
  if (diffDays === -1) return "Gestern";
  if (diffDays > 1 && diffDays < 7) return `In ${diffDays} Tagen`;
  if (diffDays < -1 && diffDays > -7) return `Vor ${-diffDays} Tagen`;
  const MONATE_KURZ = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
  return `${target.getDate()}. ${MONATE_KURZ[target.getMonth()]}`;
}
function weekdayShort(iso) {
  const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  return WD[parseIso(iso).getDay()];
}

function uid() { return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// Berechnet den Status automatisch aus überfälligen/nahenden offenen Terminen + Fortschritt.
// Eine manuelle Überschreibung (project.statusOverride) hat immer Vorrang, damit man den
// Status jederzeit bewusst selbst setzen kann. "Fun" wird nie automatisch vergeben — das
// ist eine reine Geschmackssache, die nur manuell gesetzt wird.
function computeAutoStatus(project, projectEvents) {
  const todayIso = isoDate(new Date());
  const openEvents = (projectEvents || []).filter((e) => !e.done);
  const hasOverdue = openEvents.some((e) => e.date < todayIso);
  if (hasOverdue) return "prioritaet";
  const soonCutoff = isoDate(addDays(new Date(), 3));
  const hasSoon = openEvents.some((e) => e.date <= soonCutoff);
  if (hasSoon) return "zeitnah";
  if (project.progress > 0) return "arbeit";
  return "planung";
}
function getEffectiveStatus(project, projectEvents) {
  return project.statusOverride || computeAutoStatus(project, projectEvents);
}

   muss. Komplett eigenes Markup, keine Browser-native Komponente
   beteiligt.
   ============================================================ */
function StatusPicker({ project, autoStatus, onChange }) {
  const options = [
    { key: null, label: `Automatisch (${STATUS_CONFIG[autoStatus].label})`, color: STATUS_CONFIG[autoStatus].color },
    ...Object.entries(STATUS_CONFIG).map(([key, cfg]) => ({ key, label: cfg.label, color: cfg.color })),
  ];
  const activeKey = project.statusOverride || null;

  return (
    <div className="flex flex-wrap gap-2">
      {options.map((opt) => {
        const active = activeKey === opt.key;
        return (
          <button
            key={opt.key || "auto"}
            type="button"
            onClick={() => onChange(opt.key)}
            className="inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold transition-colors"
            style={
              active
                ? { background: `${opt.color}22`, border: `1px solid ${opt.color}`, color: opt.color }
                : { background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.1)", color: "#8b93a7" }
            }
          >
            <span className="h-1.5 w-1.5 rounded-full flex-shrink-0" style={{ background: opt.color }} />
            {opt.label}
          </button>
        );
      })}
    </div>
  );
}

function ProjectDetail({ project, events, categories, categoriesById, onToggleDone, onEditEvent, onBack, onAddEvent, onDeleteProject, onUpdateProject, onManageCategories }) {
  const tokens = COLOR_TOKENS[project.color] || COLOR_TOKENS.violet;
  const [categoryFilter, setCategoryFilter] = useState(null);
  const filteredEvents = categoryFilter ? events.filter((e) => e.categoryId === categoryFilter) : events;
  const sorted = [...filteredEvents].sort((a, b) => a.date.localeCompare(b.date));
  const open = sorted.filter((e) => !e.done);
  const done = sorted.filter((e) => e.done);
  const fileInputRef = useRef(null);
  const effectiveStatus = getEffectiveStatus(project, events);
  const autoStatus = computeAutoStatus(project, events);

  function handleImagePick(e) {
    const file = e.target.files && e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = () => onUpdateProject(project.id, { image: reader.result });
      reader.readAsDataURL(file);
    }
    e.target.value = "";
  }

  return (
    <div>
      <button onClick={onBack} className="inline-flex items-center gap-1.5 text-sm mb-5 transition-opacity hover:opacity-70" style={{ color: "#8b93a7" }}>
        <ArrowLeft size={16} /> Zurück zu Projekten
      </button>

      <div className="rounded-2xl overflow-hidden mb-6" style={{ background: "rgba(255,255,255,0.035)", border: "1px solid rgba(255,255,255,0.08)" }}>
        <div
          className="h-36 relative flex items-end p-5 overflow-hidden"
          style={!project.image ? { background: `radial-gradient(120% 160% at 10% 0%, ${tokens.dim}, transparent 65%)` } : undefined}
        >
          {project.image ? (
            <>
              <img src={project.image} alt="" className="absolute inset-0 h-full w-full object-cover" />
              <div className="absolute inset-0" style={{ background: "linear-gradient(180deg, rgba(10,14,26,0.15) 0%, rgba(10,14,26,0.85) 100%)" }} />
            </>
          ) : (
            <div className="absolute inset-0 opacity-30" style={{ backgroundImage: `radial-gradient(${tokens.accent}33 1px, transparent 1px)`, backgroundSize: "16px 16px" }} />
          )}
          <div className="relative flex items-end justify-between w-full">
            <div>
              <h1 className="text-2xl font-bold mb-2" style={{ fontFamily: "'Rajdhani',sans-serif", color: "#fff", letterSpacing: "0.3px" }}>
                {project.name}
              </h1>
              <StatusPill status={effectiveStatus} />
            </div>
            <div className="flex items-center gap-1.5 flex-shrink-0">
              <button
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                className="relative rounded-lg p-2 transition-colors hover:bg-white/10"
                style={{ color: "#8b93a7" }}
                title={project.image ? "Bild ändern" : "Bild hochladen"}
              >
                <ImagePlus size={16} />
              </button>
              <button
                onClick={() => onDeleteProject(project.id)}
                className="relative rounded-lg p-2 transition-colors hover:bg-white/10"
                style={{ color: "#8b93a7" }}
                title="Projekt löschen"
              >
                <Trash2 size={16} />
              </button>
              <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={handleImagePick} />
            </div>
          </div>
        </div>
        <div className="p-5">
          <div className="flex items-center justify-between mb-1.5 text-xs" style={{ color: "#8b93a7" }}>
            <span>Fortschritt</span>
            <span style={{ color: tokens.accent }}>{project.progress}%</span>
          </div>
          <ProgressBar value={project.progress} color={project.color} />

          <div className="mt-4 mb-1.5 text-xs" style={{ color: "#8b93a7" }}>Status</div>
          <StatusPicker
            project={project}
            autoStatus={autoStatus}
            onChange={(val) => onUpdateProject(project.id, { statusOverride: val })}
          />
        </div>
      </div>

      <div className="flex items-center justify-between mb-3 gap-3 flex-wrap">
        <h2 className="text-sm font-semibold uppercase tracking-wide" style={{ color: "#8b93a7" }}>Termine &amp; Tasks</h2>
        <button
          onClick={() => onAddEvent(project.id)}
          className="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold transition-transform hover:scale-105"
          style={{ background: tokens.grad, color: "#0a0e1a" }}
        >
          <Plus size={14} strokeWidth={2.5} /> Hinzufügen
        </button>
      </div>

      <div className="mb-3">
        <CategoryFilterBar categories={categories} activeId={categoryFilter} onChange={setCategoryFilter} onManage={onManageCategories} />
      </div>

      <div className="space-y-2">
        {open.length === 0 && done.length === 0 && (
          <div className="rounded-xl py-8 text-center text-sm" style={{ color: "#8b93a7", border: "1px dashed rgba(255,255,255,0.1)" }}>
            {events.length === 0
              ? 'Noch keine Termine oder Tasks — leg den ersten mit "Hinzufügen" an.'
              : "Keine Einträge in dieser Kategorie."}
          </div>
        )}
        {open.map((ev) => (
          <EventRow key={ev.id} ev={ev} project={project} category={categoriesById[ev.categoryId]} onToggleDone={onToggleDone} onEdit={onEditEvent} showProject={false} />
        ))}
        {done.length > 0 && (
          <>
            <div className="text-xs font-semibold uppercase tracking-wide pt-3 pb-1" style={{ color: "#8b93a7" }}>Erledigt</div>
            {done.map((ev) => (
              <EventRow key={ev.id} ev={ev} project={project} category={categoriesById[ev.categoryId]} onToggleDone={onToggleDone} onEdit={onEditEvent} showProject={false} />
            ))}
          </>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   GLOBALE KALENDER-/TIMELINE-ANSICHT
   ============================================================ */
function TimelineView({ events, projectsById, categories, categoriesById, onToggleDone, onEditEvent, onAddEvent, onManageCategories }) {
  const [categoryFilter, setCategoryFilter] = useState(null);
  const upcoming = events
    .filter((e) => !e.done)
    .filter((e) => !categoryFilter || e.categoryId === categoryFilter)
    .sort((a, b) => a.date.localeCompare(b.date) || (a.time || "99:99").localeCompare(b.time || "99:99"));

  const groups = [];
  upcoming.forEach((ev) => {
    const last = groups[groups.length - 1];
    if (last && last.date === ev.date) last.items.push(ev);
    else groups.push({ date: ev.date, items: [ev] });
  });

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-sm font-semibold uppercase tracking-wide" style={{ color: "#8b93a7" }}>Anstehend — alle Projekte</h2>
        <button
          onClick={() => onAddEvent(null)}
          className="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold transition-transform hover:scale-105"
          style={{ background: "linear-gradient(135deg,#8b7bff,#5b4fe0)", color: "#0a0e1a" }}
        >
          <Plus size={14} strokeWidth={2.5} /> Neuer Termin
        </button>
      </div>

      <div className="mb-4">
        <CategoryFilterBar categories={categories} activeId={categoryFilter} onChange={setCategoryFilter} onManage={onManageCategories} />
      </div>

      {groups.length === 0 && (
        <div className="rounded-xl py-10 text-center text-sm" style={{ color: "#8b93a7", border: "1px dashed rgba(255,255,255,0.1)" }}>
          {categoryFilter ? "Keine Einträge in dieser Kategorie." : "Nichts Anstehendes — alles erledigt."}
        </div>
      )}

      <div className="space-y-5">
        {groups.map((g) => (
          <div key={g.date} className="flex gap-4">
            <div className="flex-shrink-0 w-14 pt-2.5 text-center">
              <div className="text-[11px] font-semibold uppercase tracking-wide" style={{ color: "#8b93a7" }}>{weekdayShort(g.date)}</div>
              <div className="text-lg font-bold" style={{ fontFamily: "'Rajdhani',sans-serif", color: "#eef1f8" }}>{parseIso(g.date).getDate()}</div>
            </div>
            <div className="flex-1 space-y-2">
              {g.items.map((ev) => (
                <EventRow key={ev.id} ev={ev} project={projectsById[ev.projectId]} category={categoriesById[ev.categoryId]} onToggleDone={onToggleDone} onEdit={onEditEvent} showProject={true} />
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   MODAL: NEUER TERMIN/TASK
   ============================================================ */
function EventModal({ projects, categories, defaultProjectId, initialEvent, onSave, onClose, onCreateCategory, onDelete }) {
  const isEditing = !!initialEvent;
  const [title, setTitle] = useState(initialEvent ? initialEvent.title : "");
  const [date, setDate] = useState(initialEvent ? initialEvent.date : isoDate(new Date()));
  const [time, setTime] = useState(initialEvent ? initialEvent.time || "" : "");
  const [type, setType] = useState(initialEvent ? initialEvent.type : "task");
  const [projectId, setProjectId] = useState(initialEvent ? initialEvent.projectId || "" : defaultProjectId || "");
  const [categoryId, setCategoryId] = useState(initialEvent ? initialEvent.categoryId || null : null);
  const [notes, setNotes] = useState(initialEvent ? initialEvent.notes || "" : "");

  const [newCatName, setNewCatName] = useState("");

  function handleCreateCategory() {
    const name = newCatName.trim();
    if (!name) return;
    const id = onCreateCategory({ name, color: newCatColor });
    setCategoryId(id);
    setNewCatName("");
    setShowNewCategory(false);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(5,7,14,0.7)", backdropFilter: "blur(4px)" }}>
      <div
        className="w-full max-w-sm rounded-2xl p-5"

      >
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-semibold" style={{ fontFamily: "'Rajdhani',sans-serif", color: "#fff" }}>
            {isEditing ? "Eintrag bearbeiten" : "Neuer Eintrag"}

        <label className="block text-xs font-semibold mb-1.5" style={{ color: "#8b93a7" }}>Titel</label>
        <input

          value={title}

          className="w-full rounded-lg px-3 py-2 text-sm mb-4 outline-none"

        <div className="grid grid-cols-2 gap-3 mb-4">

            <input

              onChange={(e) => setDate(e.target.value)}

              style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", color: "#eef1f8", colorScheme: "dark" }}
            />
          </div>
          <div>
            <label className="block text-xs font-semibold mb-1.5" style={{ color: "#8b93a7" }}>Uhrzeit (optional)</label>
            <input

              value={time}
              onChange={(e) => setTime(e.target.value)}

              style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", color: "#eef1f8", colorScheme: "dark" }}
            />
          </div>
        </div>

        <label className="block text-xs font-semibold mb-1.5" style={{ color: "#8b93a7" }}>Typ</label>
        <div className="flex gap-2 mb-4">
          {["task", "termin"].map((t) => (
            <button
              key={t}
              onClick={() => setType(t)}
              className="flex-1 rounded-lg py-2 text-xs font-semibold capitalize transition-colors"
              style={
                type === t

                  : { background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)", color: "#8b93a7" }

        <label className="block text-xs font-semibold mb-1.5" style={{ color: "#8b93a7" }}>Projekt</label>
        <select
          value={projectId}
          onChange={(e) => setProjectId(e.target.value)}
          className="w-full rounded-lg px-3 py-2 text-sm mb-5 outline-none"
          style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", color: "#eef1f8", colorScheme: "dark" }}
        >
          <option value="">Kein Projekt</option>

        <label className="block text-xs font-semibold mb-1.5" style={{ color: "#8b93a7" }}>Kategorie (optional)</label>
        <div className="flex items-center gap-1.5 mb-1.5 flex-wrap">

            type="button"
            onClick={() => setCategoryId(null)}

                onClick={() => setCategoryId(c.id)}

                style={

                }
              >
                <span className="h-1.5 w-1.5 rounded-full flex-shrink-0" style={{ background: c.color }} />

            type="button"
            onClick={() => setShowNewCategory((v) => !v)}

            style={{ background: "rgba(255,255,255,0.04)", border: "1px dashed rgba(255,255,255,0.2)", color: "#8b93a7" }}
          >
            <Plus size={11} strokeWidth={2.5} /> Neu
          </button>
        </div>

        {showNewCategory && (
          <div className="rounded-lg p-3 mb-4" style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.08)" }}>
            <input
              autoFocus
              value={newCatName}
              onChange={(e) => setNewCatName(e.target.value)}
              placeholder="Name der Kategorie"
              className="w-full rounded-lg px-3 py-1.5 text-sm mb-2 outline-none"
              style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", color: "#eef1f8" }}
            />
            <div className="flex items-center gap-1.5 mb-2 flex-wrap">
              {CATEGORY_SWATCHES.map((sw) => (
                <button
                  key={sw}
                  type="button"
                  onClick={() => setNewCatColor(sw)}
                  className="h-6 w-6 rounded-full flex-shrink-0 transition-transform hover:scale-110"
                  style={{ background: sw, boxShadow: newCatColor === sw ? `0 0 0 2px #10141f, 0 0 0 4px ${sw}` : "none" }}
                />
              ))}
              <input
                type="color"
                value={newCatColor}
                onChange={(e) => setNewCatColor(e.target.value)}
                title="Eigene Farbe wählen"
                className="h-6 w-6 rounded-full flex-shrink-0 cursor-pointer bg-transparent"
                style={{ border: "1px solid rgba(255,255,255,0.2)" }}

            <div className="flex justify-end gap-2">

                type="button"
                disabled={!newCatName.trim()}
                onClick={handleCreateCategory}
                className="rounded-md px-3 py-1 text-xs font-semibold disabled:opacity-40"
                style={{ background: newCatColor, color: "#0a0e1a" }}

          </div>

        <label className="block text-xs font-semibold mb-1.5 mt-4" style={{ color: "#8b93a7" }}>Notiz (optional)</label>

/* ============================================================
   MODAL: KATEGORIEN VERWALTEN — freies Anlegen/Umbenennen/Löschen
   eigener Kategorien (Name + Farbe). Löschen entfernt die Kategorie
   nur von den Terminen/Tasks (categoryId -> null), löscht diese aber
   nicht.
   ============================================================ */
function CategoryManagerModal({ categories, onCreate, onUpdate, onDelete, onClose }) {
  const [newName, setNewName] = useState("");
  const [newColor, setNewColor] = useState(CATEGORY_SWATCHES[0]);
  const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState("");
  const [editColor, setEditColor] = useState("");

  function startEdit(c) {
    setEditingId(c.id);
    setEditName(c.name);
    setEditColor(c.color);
  }
  function saveEdit() {
    if (editName.trim()) onUpdate(editingId, { name: editName.trim(), color: editColor });
    setEditingId(null);
  }
  function handleCreate() {
    const name = newName.trim();
    if (!name) return;
    onCreate({ name, color: newColor });
    setNewName("");
    setNewColor(CATEGORY_SWATCHES[0]);
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(5,7,14,0.7)", backdropFilter: "blur(4px)" }}>
      <div
        className="w-full max-w-sm rounded-2xl p-5"
        style={{ background: "rgba(16,20,34,0.95)", border: "1px solid rgba(255,255,255,0.1)", boxShadow: "0 20px 60px rgba(0,0,0,0.5)" }}
      >
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-semibold inline-flex items-center gap-2" style={{ fontFamily: "'Rajdhani',sans-serif", color: "#fff" }}>
            <Tag size={16} style={{ color: "#a996ff" }} /> Kategorien
          </h3>
          <button onClick={onClose} className="opacity-60 hover:opacity-100 transition-opacity"><X size={18} /></button>
        </div>

        <div className="space-y-2 mb-4 max-h-64 overflow-y-auto">
          {categories.length === 0 && (
            <div className="text-xs py-4 text-center" style={{ color: "#8b93a7" }}>Noch keine Kategorien angelegt.</div>
          )}
          {categories.map((c) => (
            <div key={c.id} className="rounded-lg p-2.5" style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.07)" }}>
              {editingId === c.id ? (
                <div>
                  <input
                    autoFocus
                    value={editName}
                    onChange={(e) => setEditName(e.target.value)}
                    className="w-full rounded-md px-2 py-1 text-sm mb-2 outline-none"
                    style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", color: "#eef1f8" }}
                  />
                  <div className="flex items-center gap-1.5 mb-2 flex-wrap">
                    {CATEGORY_SWATCHES.map((sw) => (
                      <button
                        key={sw}
                        onClick={() => setEditColor(sw)}
                        className="h-5 w-5 rounded-full flex-shrink-0 transition-transform hover:scale-110"
                        style={{ background: sw, boxShadow: editColor === sw ? `0 0 0 2px #10141f, 0 0 0 3px ${sw}` : "none" }}
                      />
                    ))}
                    <input
                      type="color"
                      value={editColor}
                      onChange={(e) => setEditColor(e.target.value)}
                      className="h-5 w-5 rounded-full flex-shrink-0 cursor-pointer bg-transparent"
                      style={{ border: "1px solid rgba(255,255,255,0.2)" }}
                    />
                  </div>
                  <div className="flex justify-end gap-1.5">
                    <button onClick={() => setEditingId(null)} className="rounded-md px-2 py-1 text-xs font-semibold" style={{ color: "#8b93a7" }}>Abbrechen</button>
                    <button onClick={saveEdit} className="inline-flex items-center gap-1 rounded-md px-2 py-1 text-xs font-semibold" style={{ background: editColor, color: "#0a0e1a" }}>
                      <Check size={12} /> Speichern
                    </button>
                  </div>
                </div>

/* ============================================================
   HAUPTKOMPONENTE
   ============================================================ */
/* ============================================================
   GOOGLE DRIVE SYNC — sichert Projekte & Termine automatisch in einer
   JSON-Datei im eigenen Google Drive des Nutzers (Scope "drive.file": die
   App sieht NUR Dateien, die sie selbst angelegt hat). Nutzt bewusst
   dieselbe OAuth-Client-ID und denselben Sync-Ansatz (Google Identity
   Services + Multipart-Upload) wie Kalender und Trading Journal.
   ============================================================ */
const DRIVE_CLIENT_ID = "273314490848-f25ar1ji7u1iudbnir425ai1vivaonvn.apps.googleusercontent.com";
/* ============================================================
   HUB-WEITER GOOGLE-LOGIN-CACHE — wortgleicher Block auch in
   kalender-julian.html und trading-journal-julian.html. Alle drei Apps
   fragen denselben (kombinierten) Scope an und liegen auf derselben
   Domain, teilen sich also über localStorage EIN Google-Access-Token:
   wer sich in einer Kachel anmeldet, ist beim Wechsel zur nächsten schon
   angemeldet, solange das Token noch gültig ist (~55 Min.) — kein
   erneuter Google-Dialog beim Kachel-Wechsel mehr nötig.
   ============================================================ */
const JMB_SCOPE = "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/calendar.events";
const JMB_TOKEN_KEY = "jmb_google_token_v1";
const JMB_TOKEN_EXP_KEY = "jmb_google_token_exp_v1";
const JMB_CONNECTED_KEY = "jmb_google_connected_v1";
function jmbSaveToken(token, expiresAt) {
  try {
    localStorage.setItem(JMB_TOKEN_KEY, token);
    localStorage.setItem(JMB_TOKEN_EXP_KEY, String(expiresAt));
    localStorage.setItem(JMB_CONNECTED_KEY, "1");
  } catch (err) { /* z.B. localStorage voll/blockiert — Token bleibt dann nur im Speicher dieser Seite */ }
}
function jmbLoadSharedToken() {
  const token = localStorage.getItem(JMB_TOKEN_KEY);
  const expiresAt = parseInt(localStorage.getItem(JMB_TOKEN_EXP_KEY), 10) || 0;
  if (token && Date.now() < expiresAt) return { token, expiresAt };
  return null;
}
function jmbClearToken() {
  localStorage.removeItem(JMB_TOKEN_KEY);
  localStorage.removeItem(JMB_TOKEN_EXP_KEY);
  localStorage.removeItem(JMB_CONNECTED_KEY);
}

const DRIVE_SCOPE = JMB_SCOPE;
const DRIVE_FILENAME = "projekte-julian-backup.json";
const LS_DRIVE_FILEID = "pj_drivefileid_v1";
const LS_DRIVE_CONNECTED = JMB_CONNECTED_KEY;
const LS_DRIVE_LASTSYNC = "pj_drivelastsync_v1";

function useDriveSync(getPayload, applyPayload) {
  const [status, setStatus] = useState({ connected: false, syncing: false, lastSync: null });
  const tokenClientRef = useRef(null);
  const accessTokenRef = useRef(null);
  const expiresAtRef = useRef(0);
  const saveTimerRef = useRef(null);
  const connectedRef = useRef(false);
  const syncingRef = useRef(false);

  function setConnected(v) { connectedRef.current = v; setStatus((s) => ({ ...s, connected: v })); }
  function setSyncing(v) { syncingRef.current = v; setStatus((s) => ({ ...s, syncing: v })); }
  function setLastSync(t) { setStatus((s) => ({ ...s, lastSync: t })); }

  function buildMultipart(metadata, content) {
    const boundary = "pj_drive_boundary_" + Date.now();
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${content}\r\n` +
      `--${boundary}--`;
    return { body, contentType: `multipart/related; boundary=${boundary}` };
  }

  async function findFile() {
    const cachedId = localStorage.getItem(LS_DRIVE_FILEID);
    if (cachedId) {
      const check = await fetch(`https://www.googleapis.com/drive/v3/files/${cachedId}?fields=id`, {
        headers: { Authorization: `Bearer ${accessTokenRef.current}` },
      });
      if (check.ok) return cachedId;
      localStorage.removeItem(LS_DRIVE_FILEID);
    }
    const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
      headers: { Authorization: `Bearer ${accessTokenRef.current}` },
    });
    const data = await res.json();
    if (data.files && data.files.length > 0) {
      localStorage.setItem(LS_DRIVE_FILEID, data.files[0].id);
      return data.files[0].id;
    }
    return null;
  }

  async function saveNow() {
    if (syncingRef.current) return;
    setSyncing(true);
    try {
      await ensureFreshToken();
      const content = JSON.stringify(getPayload());
      const fileId = await findFile();
      const { body, contentType } = buildMultipart({ name: DRIVE_FILENAME, mimeType: "application/json" }, content);
      const url = fileId
        ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
        : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
      const res = await fetch(url, {
        method: fileId ? "PATCH" : "POST",
        headers: { Authorization: `Bearer ${accessTokenRef.current}`, "Content-Type": contentType },
        body,
      });
      const data = await res.json();
      if (data.id) localStorage.setItem(LS_DRIVE_FILEID, data.id);
      const now = Date.now();
      localStorage.setItem(LS_DRIVE_LASTSYNC, String(now));
      setLastSync(now);
    } catch (err) {
      console.error("Drive-Sicherung fehlgeschlagen:", err);
    } finally {
      setSyncing(false);
    }
  }

  // Lädt einen vorhandenen Drive-Stand. Gibt true zurück, wenn eine Datei gefunden und
  // (nach Bestätigung, falls gefordert) geladen wurde — sonst false, damit der Aufrufer
  // weiß, dass stattdessen ein initialer Upload nötig ist.
  async function loadNow(askConfirm) {
    try {
      await ensureFreshToken();
      const fileId = await findFile();
      if (!fileId) return false;
      const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { Authorization: `Bearer ${accessTokenRef.current}` },
      });
      const data = await res.json();
      if (!data || !Array.isArray(data.projects) || !Array.isArray(data.events)) return false;
      if (askConfirm && !window.confirm("Daten aus Google Drive laden? Das ersetzt deine aktuellen lokalen Projekte & Termine.")) return true;
      applyPayload(data);
      const now = Date.now();
      localStorage.setItem(LS_DRIVE_LASTSYNC, String(now));
      setLastSync(now);
      return true;
    } catch (err) {
      console.error("Laden aus Drive fehlgeschlagen:", err);
      return false;
    }
  }

  function ensureFreshToken() {
    return new Promise((resolve, reject) => {
      if (accessTokenRef.current && Date.now() < expiresAtRef.current) { resolve(accessTokenRef.current); return; }
      if (!tokenClientRef.current) { reject(new Error("Google-Anmeldung noch nicht bereit")); return; }
      const prev = tokenClientRef.current.callback;
      tokenClientRef.current.callback = (resp) => {
        tokenClientRef.current.callback = prev;
        onTokenResponse(resp);
        if (resp && !resp.error) resolve(resp.access_token); else reject(new Error("Google-Anmeldung abgelaufen"));
      };
      tokenClientRef.current.requestAccessToken({ prompt: "" });
    });
  }

  function scheduleTokenRefresh() {
    setTimeout(() => {
      if (connectedRef.current && tokenClientRef.current) tokenClientRef.current.requestAccessToken({ prompt: "" });
    }, Math.max(expiresAtRef.current - Date.now() - 300000, 60000));
  }

  async function onTokenResponse(resp) {
    if (!resp || resp.error) { setConnected(false); return; }
    accessTokenRef.current = resp.access_token;
    expiresAtRef.current = Date.now() + (parseInt(resp.expires_in, 10) || 3500) * 1000 - 60000;
    setConnected(true);
    jmbSaveToken(accessTokenRef.current, expiresAtRef.current); // im HUB-WEITEN Cache speichern, nicht nur lokal
    scheduleTokenRefresh();
    // Ein vorhandenes Drive-Backup gewinnt immer gegen den lokalen Stand (der ohne
    // Backup nur die Demo-Projekte wäre) — nur wenn wirklich noch nichts in Drive liegt,
    // wird der aktuelle lokale Stand als allererstes Backup hochgeladen.
    const found = await loadNow(false);
    if (!found) saveNow();
  }

  useEffect(() => {
    let tries = 0;
    function init() {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) {
        tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
          client_id: DRIVE_CLIENT_ID,
          scope: DRIVE_SCOPE,
          callback: onTokenResponse,
        });
        // 1. Erst prüfen, ob eine ANDERE Hub-Kachel (Kalender/Journal) schon ein gültiges
        //    Token im gemeinsamen Cache hinterlegt hat -> direkt übernehmen, ganz ohne
        //    Google-Anfrage (kein Aufblitzen, kein erneuter Login beim Kachel-Wechsel).
        const shared = jmbLoadSharedToken();
        if (shared) {
          accessTokenRef.current = shared.token;
          expiresAtRef.current = shared.expiresAt;
          setConnected(true);
          scheduleTokenRefresh();
          loadNow(false);
          return;
        }
        // 2. Kein gültiger Cache, aber früher schon mal verbunden -> stiller Reconnect-Versuch.
        if (localStorage.getItem(LS_DRIVE_CONNECTED) === "1") {
          tokenClientRef.current.requestAccessToken({ prompt: "" });
        }
        return;
      }
      if (tries < 50) { tries += 1; setTimeout(init, 200); }
    }
    init();
  }, []);

  function connect() {
    if (tokenClientRef.current) tokenClientRef.current.requestAccessToken({});
  }
  function disconnect() {
    setConnected(false);
    jmbClearToken(); // trennt hub-weit — Kalender/Journal fragen beim nächsten Öffnen wieder neu an
    accessTokenRef.current = null;
  }
  function scheduleSave() {
    if (!connectedRef.current) return;
    clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(saveNow, 4000);
  }

  return { status, connect, disconnect, scheduleSave, loadNow: () => loadNow(true) };
}

function ProjekteDashboard() {
  const [projects, setProjects] = useState(initialProjects);
  const [events, setEvents] = useState(initialEvents);
  const [categories, setCategories] = useState(initialCategories);
  const [selectedProjectId, setSelectedProjectId] = useState(null);
  const [tab, setTab] = useState("projects"); // 'projects' | 'timeline'
  const [search, setSearch] = useState("");
  const [eventModalProjectId, setEventModalProjectId] = useState(undefined); // undefined = geschlossen, null/id = offen
  const [editingEvent, setEditingEvent] = useState(null); // gesetzt = Bearbeiten-Modal für diesen Termin/Task offen
  const [showProjectModal, setShowProjectModal] = useState(false);
  const [showCategoryModal, setShowCategoryModal] = useState(false);

  // Refs mit dem jeweils aktuellsten Stand — so bekommt der Drive-Sync-Hook (der seinen
  // Google-Callback nur einmal beim Start einrichtet) immer die frischen Daten, statt an
  // einem alten Stand von damals festzuhängen.
  const projectsRef = useRef(projects);
  const eventsRef = useRef(events);
  const categoriesRef = useRef(categories);
  useEffect(() => { projectsRef.current = projects; }, [projects]);
  useEffect(() => { eventsRef.current = events; }, [events]);
  useEffect(() => { categoriesRef.current = categories; }, [categories]);

  const drive = useDriveSync(
    () => ({ projects: projectsRef.current, events: eventsRef.current, categories: categoriesRef.current }),
    (data) => { setProjects(data.projects); setEvents(data.events); setCategories(Array.isArray(data.categories) ? data.categories : []); }
  );
  // Bei jeder Änderung an Projekten/Terminen/Kategorien (debounced 4s) automatisch nach
  // Drive sichern — genauso wie im Kalender und Trading Journal.
  useEffect(() => { drive.scheduleSave(); }, [projects, events, categories]);

  const projectsById = useMemo(() => Object.fromEntries(projects.map((p) => [p.id, p])), [projects]);
  const categoriesById = useMemo(() => Object.fromEntries(categories.map((c) => [c.id, c])), [categories]);

  const eventsByProject = useMemo(() => {
    const map = {};
    projects.forEach((p) => (map[p.id] = []));
    events.forEach((e) => { if (e.projectId && map[e.projectId]) map[e.projectId].push(e); });
    return map;
  }, [projects, events]);

  const filteredProjects = projects.filter((p) => p.name.toLowerCase().includes(search.toLowerCase()));

  function toggleDone(id) {
    setEvents((prev) => prev.map((e) => (e.id === id ? { ...e, done: !e.done } : e)));
  }

  function addEvent(newEv) {
    setEvents((prev) => [...prev, { id: uid(), done: false, ...newEv }]);
    setEventModalProjectId(undefined);
  }

  function updateEvent(id, patch) {
    setEvents((prev) => prev.map((e) => (e.id === id ? { ...e, ...patch } : e)));
    setEditingEvent(null);
  }

  function deleteEvent(id) {
    setEvents((prev) => prev.filter((e) => e.id !== id));
    setEditingEvent(null);
  }

  function addProject(newProj) {
    setProjects((prev) => [...prev, { id: uid(), ...newProj }]);
    setShowProjectModal(false);
  }

  function updateProject(id, patch) {
    setProjects((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  }

  function deleteProject(id) {
    setProjects((prev) => prev.filter((p) => p.id !== id));
    setEvents((prev) => prev.map((e) => (e.projectId === id ? { ...e, projectId: null } : e)));
    setSelectedProjectId(null);
  }

  // Kategorien: frei anlegbar/umbenennbar/löschbar. Löschen entfernt die Zuordnung von
  // betroffenen Terminen/Tasks (categoryId -> null), löscht diese aber nicht selbst.
  function addCategory(newCat) {
    const id = uid();
    setCategories((prev) => [...prev, { id, ...newCat }]);
    return id;
  }
  function updateCategory(id, patch) {
    setCategories((prev) => prev.map((c) => (c.id === id ? { ...c, ...patch } : c)));
  }
  function deleteCategory(id) {
    setCategories((prev) => prev.filter((c) => c.id !== id));
    setEvents((prev) => prev.map((e) => (e.categoryId === id ? { ...e, categoryId: null } : e)));
  }

  const selectedProject = selectedProjectId ? projectsById[selectedProjectId] : null;

  return (
    <div
      className="min-h-screen w-full p-6 md:p-10"
      style={{
        background:
          "radial-gradient(1100px 750px at 10% -8%, rgba(124,92,255,0.16), transparent 60%)," +
          "radial-gradient(950px 700px at 92% 8%, rgba(54,198,255,0.12), transparent 55%)," +
          "radial-gradient(900px 800px at 50% 115%, rgba(255,61,154,0.08), transparent 60%)," +
          "#0a0e1a",
        fontFamily: "'Inter',sans-serif",
        color: "#eef1f8",
      }}
    >
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');`}</style>

      <div className="max-w-6xl mx-auto">
        {!selectedProject ? (
          <>
            {/* Kopfzeile */}
            <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
              <div>
                <h1 className="text-3xl font-bold" style={{ fontFamily: "'Rajdhani',sans-serif", letterSpacing: "0.3px" }}>
                  Projekte
                </h1>
                <p className="text-sm mt-1" style={{ color: "#8b93a7" }}>
                  {projects.length} Projekte · {events.filter((e) => !e.done).length} offene Termine &amp; Tasks
                </p>
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <button
                  onClick={drive.status.connected ? drive.disconnect : drive.connect}
                  title={drive.status.connected ? "Google Drive trennen" : "Mit Google Drive verbinden — sichert Projekte & Termine automatisch"}
                  className="inline-flex items-center gap-1.5 rounded-lg px-3 py-2.5 text-xs font-semibold transition-colors"
                  style={
                    drive.status.connected
                      ? { background: "rgba(43,217,185,0.14)", border: "1px solid rgba(43,217,185,0.4)", color: "#2bd9b9" }
                      : { background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.12)", color: "#8b93a7" }
                  }
                >
                  {drive.status.syncing ? (
                    <Loader size={14} className="animate-spin" />
                  ) : drive.status.connected ? (
                    <CheckCircle2 size={14} />
                  ) : (
                    <Cloud size={14} />
                  )}
                  {drive.status.connected
                    ? `Google Drive${drive.status.lastSync ? " · " + new Date(drive.status.lastSync).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : ""}`
                    : "Google Drive verbinden"}
                </button>
                <button
                  onClick={() => setShowCategoryModal(true)}
                  title="Eigene Kategorien für Termine & Tasks anlegen/verwalten"
                  className="inline-flex items-center gap-1.5 rounded-lg px-3 py-2.5 text-xs font-semibold transition-colors"
                  style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.12)", color: "#8b93a7" }}
                >
                  <Tag size={14} /> Kategorien
                </button>
                <button
                  onClick={() => setShowProjectModal(true)}
                  className="inline-flex items-center gap-1.5 rounded-lg px-4 py-2.5 text-sm font-semibold transition-transform hover:scale-105"
                  style={{ background: "linear-gradient(135deg,#8b7bff,#5b4fe0)", color: "#0a0e1a" }}
                >
                  <Plus size={16} strokeWidth={2.5} /> Neues Projekt
                </button>
              </div>
            </div>

            {/* Tabs + Suche */}
            <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
              <div className="inline-flex rounded-xl p-1" style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)" }}>
                <button
                  onClick={() => setTab("projects")}
                  className="inline-flex items-center gap-1.5 rounded-lg px-3.5 py-1.5 text-xs font-semibold transition-colors"
                  style={tab === "projects" ? { background: "rgba(124,92,255,0.2)", color: "#a996ff" } : { color: "#8b93a7" }}
                >
                  <LayoutGrid size={14} /> Projekte
                </button>
                <button
                  onClick={() => setTab("timeline")}
                  className="inline-flex items-center gap-1.5 rounded-lg px-3.5 py-1.5 text-xs font-semibold transition-colors"
                  style={tab === "timeline" ? { background: "rgba(124,92,255,0.2)", color: "#a996ff" } : { color: "#8b93a7" }}
                >
                  <CalendarClock size={14} /> Kalender
                </button>
              </div>

              {tab === "projects" && (
                <div className="relative">
                  <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: "#8b93a7" }} />
                  <input
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="Projekt suchen…"
                    className="rounded-lg pl-8 pr-3 py-2 text-sm outline-none w-48"
                    style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", color: "#eef1f8" }}
                  />
                </div>
              )}
            </div>

            {tab === "projects" ? (
              <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3">
                {filteredProjects.map((p) => {
                  const projEvents = eventsByProject[p.id] || [];
                  const openEvents = projEvents.filter((e) => !e.done);
                  const nextDue = openEvents.map((e) => e.date).sort()[0];
                  return (
                    <ProjectCard
                      key={p.id}
                      project={p}
                      status={getEffectiveStatus(p, projEvents)}
                      nextDue={nextDue}
                      openCount={openEvents.length}
                      onOpen={setSelectedProjectId}
                    />
                  );
                })}
                {filteredProjects.length === 0 && (
                  <div className="col-span-full rounded-xl py-10 text-center text-sm" style={{ color: "#8b93a7", border: "1px dashed rgba(255,255,255,0.1)" }}>
                    Kein Projekt gefunden für "{search}".
                  </div>
                )}
              </div>
            ) : (
              <TimelineView
                events={events}
                projectsById={projectsById}
                categories={categories}
                categoriesById={categoriesById}
                onToggleDone={toggleDone}
                onEditEvent={setEditingEvent}
                onAddEvent={setEventModalProjectId}
                onManageCategories={() => setShowCategoryModal(true)}
              />
            )}
          </>
        ) : (
          <ProjectDetail
            project={selectedProject}
            events={eventsByProject[selectedProject.id] || []}
            categories={categories}
            categoriesById={categoriesById}
            onBack={() => setSelectedProjectId(null)}
            onToggleDone={toggleDone}
            onEditEvent={setEditingEvent}
            onAddEvent={setEventModalProjectId}
            onDeleteProject={deleteProject}
            onUpdateProject={updateProject}
            onManageCategories={() => setShowCategoryModal(true)}
          />
        )}
      </div>

      {eventModalProjectId !== undefined && (
        <EventModal
          projects={projects}
          categories={categories}
          defaultProjectId={eventModalProjectId}
          onSave={addEvent}
          onClose={() => setEventModalProjectId(undefined)}
          onCreateCategory={addCategory}
        />
      )}
      {editingEvent && (
        <EventModal
          projects={projects}
          categories={categories}
          initialEvent={editingEvent}
          onSave={(patch) => updateEvent(editingEvent.id, patch)}
          onClose={() => setEditingEvent(null)}
          onCreateCategory={addCategory}
          onDelete={() => {
            if (window.confirm(`"${editingEvent.title}" wirklich löschen?`)) deleteEvent(editingEvent.id);
          }}
        />
      )}
      {showProjectModal && <ProjectModal onSave={addProject} onClose={() => setShowProjectModal(false)} />}
      {showCategoryModal && (
        <CategoryManagerModal
          categories={categories}
          onCreate={addCategory}
          onUpdate={updateCategory}
          onDelete={deleteCategory}
          onClose={() => setShowCategoryModal(false)}
        />
      )}
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<ProjekteDashboard />);
window.__projekteMounted = true;
const bootStatus = document.getElementById('boot-status');
if(bootStatus) bootStatus.remove();
</script>
</body>
</html>
