<!-- Sichtbare Fehleranzeige: greift JEDEN Fehler ab (Script-Ladefehler, JS-Fehler, verworfene
     Promises) und zeigt ihn direkt auf der Seite an, statt dass nur ein leerer schwarzer
     Bildschirm übrig bleibt. Läuft VOR dem eigentlichen React-Code, damit auch Fehler beim
     Laden von React/Babel/Icons selbst abgefangen werden. -->
<script>
  function showBootError(msg){
    var el = document.getElementById('boot-status');
    if(!el) return;
    el.classList.add('error');
    el.innerHTML = '⚠ Beim Laden ist ein Fehler aufgetreten:<br><pre></pre><div style="margin-top:6px;">Bitte diesen Text an Claude schicken.</div>';
    el.querySelector('pre').textContent = msg;
  }
  window.addEventListener('error', function(e){ showBootError(e.message + (e.filename ? ('\n' + e.filename + ':' + e.lineno) : '')); });
  window.addEventListener('unhandledrejection', function(e){ showBootError(String(e.reason && e.reason.stack || e.reason)); });
  // Falls nach 8 Sekunden immer noch nichts gerendert wurde (z.B. weil ein <script>-Tag von
  // einem CDN blockiert/geblockt wurde, ohne dass ein JS-Fehler ausgelöst wurde): auch das
  // sichtbar machen, statt stumm schwarz zu bleiben.
  setTimeout(function(){
    if(!window.__projekteMounted){
      showBootError('Timeout: Die Seite hat nach 8 Sekunden nicht geladen. Vermutlich konnte eine externe Ressource (Tailwind/Babel/React/Icons von einem CDN) nicht geladen werden — z.B. durch Internet-Filter, Adblocker oder fehlenden Internetzugriff.');
    }
  }, 8000);
</script>

<script type="text/babel" data-presets="react" data-type="module">
import React, { useState, useMemo, useRef, useEffect } from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
import {

/* ============================================================
   DESIGN-TOKENS
   Bewusst dieselbe Farbfamilie wie der Rest von JMB Headquarter
   (Kalender/Journal), damit sich die Projekte-Kachel nicht wie ein
   fremdes Dashboard anfühlt. Violett ist die Leitfarbe, da es die
   Farbe der Projekte-Kachel im Hub selbst ist.
   ============================================================ */
const COLOR_TOKENS = {
  violet: { accent: "#7c5cff", dim: "rgba(124,92,255,0.14)", border: "rgba(124,92,255,0.4)", grad: "linear-gradient(135deg,#8b7bff 0%,#5b4fe0 100%)" },
  cyan:   { accent: "#36c6ff", dim: "rgba(54,198,255,0.14)",  border: "rgba(54,198,255,0.4)",  grad: "linear-gradient(135deg,#5fd4ff 0%,#2f8fe0 100%)" },
  amber:  { accent: "#f0a63d", dim: "rgba(240,166,61,0.14)",  border: "rgba(240,166,61,0.4)",  grad: "linear-gradient(135deg,#f7c873 0%,#dd8a26 100%)" },
  rose:   { accent: "#ff4d6d", dim: "rgba(255,77,109,0.14)",  border: "rgba(255,77,109,0.4)",  grad: "linear-gradient(135deg,#ff7a92 0%,#e63763 100%)" },
  teal:   { accent: "#2bd9b9", dim: "rgba(43,217,185,0.14)",  border: "rgba(43,217,185,0.4)",  grad: "linear-gradient(135deg,#5eead4 0%,#1fb89b 100%)" },
};

const STATUS_CONFIG = {
  "on-track":   { label: "Im Plan",  color: "#2bd9b9", Icon: CheckCircle2 },
  "in-progress":{ label: "In Arbeit",color: "#36c6ff", Icon: Loader },
  "planning":   { label: "Planung",  color: "#8b93a7", Icon: Circle },
  "at-risk":    { label: "Kritisch", color: "#ff4d6d", Icon: AlertTriangle },
  "done":       { label: "Fertig",   color: "#2bd9b9", Icon: CheckCircle2 },
};

const PROJECT_ICONS = { LineChart, Dumbbell, CalendarDays, FileWarning, LayoutDashboard, Rocket };
const ICON_CHOICES = Object.keys(PROJECT_ICONS);
const COLOR_CHOICES = Object.keys(COLOR_TOKENS);

/* ============================================================
   DATUMS-HILFSFUNKTIONEN
   ============================================================ */
function addDays(base, n) {
  const d = new Date(base);
  d.setDate(d.getDate() + n);
  return d;
}
function isoDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function parseIso(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function relativeDateLabel(iso) {
  const today = startOfDay(new Date());
  const target = startOfDay(parseIso(iso));
  const diffDays = Math.round((target - today) / 86400000);
  if (diffDays === 0) return "Heute";
  if (diffDays === 1) return "Morgen";
  if (diffDays === -1) return "Gestern";
  if (diffDays > 1 && diffDays < 7) return `In ${diffDays} Tagen`;
  if (diffDays < -1 && diffDays > -7) return `Vor ${-diffDays} Tagen`;
  const MONATE_KURZ = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
  return `${target.getDate()}. ${MONATE_KURZ[target.getMonth()]}`;
}
function weekdayShort(iso) {
  const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  return WD[parseIso(iso).getDay()];
}

/* ============================================================
   DUMMY-DATEN (State) — bewusst simpel gehalten, damit Julian
   Farben/Icons/Inhalte im Anschluss leicht anpassen kann.
   ============================================================ */
const today = new Date();

const initialProjects = [
  { id: "p1", name: "Trading Journal v2", icon: "LineChart", color: "violet", statusOverride: "in-progress", progress: 68 },
  { id: "p2", name: "Home Gym Umbau", icon: "Dumbbell", color: "amber", statusOverride: "planning", progress: 15 },
  { id: "p3", name: "Content Kalender", icon: "CalendarDays", color: "cyan", statusOverride: "on-track", progress: 82 },
  { id: "p4", name: "Steuererklärung 2026", icon: "FileWarning", color: "rose", statusOverride: "at-risk", progress: 30 },
  { id: "p5", name: "JMB HQ Redesign", icon: "LayoutDashboard", color: "violet", statusOverride: "in-progress", progress: 45 },
];

const initialEvents = [
  { id: "e1", title: "Backtest-Ergebnisse auswerten", date: isoDate(addDays(today, 1)), time: "10:00", projectId: "p1", type: "task", done: false },
  { id: "e2", title: "Neue Import-Schnittstelle testen", date: isoDate(addDays(today, 4)), time: "14:00", projectId: "p1", type: "termin", done: false },
  { id: "e3", title: "Backup-Routine abschließen", date: isoDate(addDays(today, -2)), time: null, projectId: "p1", type: "task", done: true },
  { id: "e4", title: "Hantelbank bestellen", date: isoDate(addDays(today, 2)), time: null, projectId: "p2", type: "task", done: false },
  { id: "e5", title: "Boden verlegen", date: isoDate(addDays(today, 9)), time: "09:00", projectId: "p2", type: "termin", done: false },
  { id: "e6", title: "Wochenplan September finalisieren", date: isoDate(addDays(today, 0)), time: "17:00", projectId: "p3", type: "task", done: false },
  { id: "e7", title: "Belege sortieren", date: isoDate(addDays(today, 3)), time: null, projectId: "p4", type: "task", done: false },
  { id: "e8", title: "Termin Steuerberater", date: isoDate(addDays(today, 6)), time: "11:30", projectId: "p4", type: "termin", done: false },
  { id: "e9", title: "Farbschema abstimmen", date: isoDate(addDays(today, 5)), time: "16:00", projectId: "p5", type: "termin", done: false },
];

function uid() { return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// Berechnet den Status automatisch aus Fortschritt + überfälligen offenen Terminen/Tasks.
// Eine manuelle Überschreibung (project.statusOverride) hat immer Vorrang, damit man den
// Status jederzeit bewusst selbst setzen kann.
function computeAutoStatus(project, projectEvents) {
  if (project.progress >= 100) return "done";
  const today = isoDate(new Date());
  const hasOverdue = (projectEvents || []).some((e) => !e.done && e.date < today);
  if (hasOverdue) return "at-risk";
  if (project.progress > 0) return "in-progress";
  return "planning";
}
function getEffectiveStatus(project, projectEvents) {
  return project.statusOverride || computeAutoStatus(project, projectEvents);
}

/* ============================================================
   KLEINTEILE
   ============================================================ */
function StatusPill({ status }) {
  const cfg = STATUS_CONFIG[status] || STATUS_CONFIG.planning;
  const Icon = cfg.Icon;
  return (
    <span
      className="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-semibold"
      style={{ background: `${cfg.color}22`, color: cfg.color, border: `1px solid ${cfg.color}55` }}
    >
      <Icon size={11} strokeWidth={2.5} />
      {cfg.label}
    </span>
  );
}

function ProgressBar({ value, color }) {
  const tokens = COLOR_TOKENS[color] || COLOR_TOKENS.violet;
  return (
    <div className="h-1.5 w-full rounded-full overflow-hidden" style={{ background: "rgba(255,255,255,0.08)" }}>
      <div
        className="h-full rounded-full transition-all duration-500"
        style={{ width: `${value}%`, background: tokens.grad, boxShadow: `0 0 10px ${tokens.accent}88` }}
      />
    </div>
  );
}

function CoverArt({ project }) {
  const tokens = COLOR_TOKENS[project.color] || COLOR_TOKENS.violet;
  const Icon = PROJECT_ICONS[project.icon] || Rocket;

  if (project.image) {
    return (
      <div className="relative h-16 w-full flex-shrink-0 overflow-hidden rounded-t-2xl">
        <img src={project.image} alt="" className="absolute inset-0 h-full w-full object-cover" />
        <div className="absolute inset-0" style={{ background: "linear-gradient(180deg, transparent 35%, rgba(10,14,26,0.75) 100%)" }} />
        <div
          className="absolute bottom-1.5 right-1.5 h-6 w-6 rounded-md flex items-center justify-center"
          style={{ background: tokens.dim, border: `1px solid ${tokens.border}`, backdropFilter: "blur(4px)" }}
        >
          <Icon size={13} style={{ color: tokens.accent }} />
        </div>
      </div>
    );
  }

  return (
    <div
      className="relative h-16 w-full flex-shrink-0 overflow-hidden rounded-t-2xl flex items-center justify-center"
      style={{ background: `radial-gradient(120% 140% at 15% 10%, ${tokens.dim}, transparent 60%), rgba(255,255,255,0.02)` }}
    >
      {/* dezentes Punktraster für den HUD-Look */}
      <div
        className="absolute inset-0 opacity-40"
        style={{ backgroundImage: `radial-gradient(${tokens.accent}33 1px, transparent 1px)`, backgroundSize: "14px 14px" }}
      />
      <div
        className="absolute -right-3 -top-3 h-16 w-16 rounded-full blur-2xl opacity-50"
        style={{ background: tokens.accent }}
      />
      <Icon size={26} strokeWidth={1.5} style={{ color: tokens.accent }} className="relative drop-shadow-lg" />
    </div>
  );
}

/* ============================================================
   PROJEKT-KACHEL
   ============================================================ */
function ProjectCard({ project, status, nextDue, openCount, onOpen }) {
  const tokens = COLOR_TOKENS[project.color] || COLOR_TOKENS.violet;
  return (
    <button
      type="button"
      onClick={() => onOpen(project.id)}
      className="group flex flex-col w-full text-left rounded-2xl overflow-hidden backdrop-blur-md transition-transform duration-200 hover:-translate-y-1"
      style={{
        background: "rgba(255,255,255,0.035)",
        border: "1px solid rgba(255,255,255,0.08)",
        boxShadow: "0 8px 24px rgba(0,0,0,0.35)",
      }}
      onMouseEnter={(e) => { e.currentTarget.style.borderColor = tokens.border; e.currentTarget.style.boxShadow = `0 8px 28px rgba(0,0,0,0.4), 0 0 0 1px ${tokens.border}`; }}
      onMouseLeave={(e) => { e.currentTarget.style.borderColor = "rgba(255,255,255,0.08)"; e.currentTarget.style.boxShadow = "0 8px 24px rgba(0,0,0,0.35)"; }}
    >
      <CoverArt project={project} />
      <div className="flex flex-col flex-1 p-3">
        <div className="flex items-start justify-between gap-2 mb-1.5">
          <h3 className="font-semibold text-sm leading-snug truncate" style={{ fontFamily: "'Rajdhani',sans-serif", color: "#eef1f8", letterSpacing: "0.2px" }}>
            {project.name}
          </h3>
          <ChevronRight size={15} className="mt-0.5 flex-shrink-0 opacity-40 group-hover:opacity-80 transition-opacity" style={{ color: tokens.accent }} />
        </div>
        <div className="mb-2"><StatusPill status={status} /></div>
        <ProgressBar value={project.progress} color={project.color} />
        <div className="flex items-center justify-between mt-2 text-xs" style={{ color: "#8b93a7" }}>
          <span className="inline-flex items-center gap-1 truncate">
            <Clock size={11} className="flex-shrink-0" />
            <span className="truncate">{nextDue ? relativeDateLabel(nextDue) : "Kein Termin"}</span>
          </span>
          <span className="inline-flex items-center gap-1 flex-shrink-0 ml-2">
            <ListChecks size={11} />
            {openCount} offen
          </span>
        </div>
      </div>
    </button>
  );
}

/* ============================================================
   TERMIN/TASK-ZEILE (wiederverwendet in Detail- & Kalenderansicht)
   ============================================================ */
function EventRow({ ev, project, onToggleDone, showProject }) {
  const tokens = project ? (COLOR_TOKENS[project.color] || COLOR_TOKENS.violet) : COLOR_TOKENS.violet;
  return (
    <div
      className="flex items-center gap-3 rounded-xl px-3 py-2.5 transition-colors"
      style={{ background: "rgba(255,255,255,0.025)", border: "1px solid rgba(255,255,255,0.06)" }}
    >
      <button onClick={() => onToggleDone(ev.id)} className="flex-shrink-0" title={ev.done ? "Als offen markieren" : "Als erledigt markieren"}>
        {ev.done ? <CheckCircle2 size={18} style={{ color: "#2bd9b9" }} /> : <Circle size={18} style={{ color: "#8b93a7" }} />}
      </button>
      <div className="min-w-0 flex-1">
        <div className={`text-sm font-medium truncate ${ev.done ? "line-through opacity-50" : ""}`} style={{ color: "#eef1f8" }}>
          {ev.title}
        </div>
        <div className="flex items-center gap-2 mt-0.5 text-xs" style={{ color: "#8b93a7" }}>
          <span>{relativeDateLabel(ev.date)}</span>
          {ev.time && <><span>·</span><span>{ev.time}</span></>}
          {showProject && project && (
            <>
              <span>·</span>
              <span className="inline-flex items-center gap-1" style={{ color: tokens.accent }}>
                <span className="h-1.5 w-1.5 rounded-full" style={{ background: tokens.accent }} />
                {project.name}
              </span>
            </>
          )}
        </div>
      </div>
      <span
        className="flex-shrink-0 text-[10px] font-semibold uppercase tracking-wide rounded-md px-1.5 py-0.5"
        style={{ color: tokens.accent, background: tokens.dim }}
      >
        {ev.type === "task" ? "Task" : "Termin"}
      </span>
    </div>
  );
}

/* ============================================================
   PROJEKT-DETAILANSICHT
   ============================================================ */
function ProjectDetail({ project, events, onBack, onToggleDone, onAddEvent, onDeleteProject, onUpdateProject }) {
  const tokens = COLOR_TOKENS[project.color] || COLOR_TOKENS.violet;
  const sorted = [...events].sort((a, b) => a.date.localeCompare(b.date));
  const open = sorted.filter((e) => !e.done);
  const done = sorted.filter((e) => e.done);
  const fileInputRef = useRef(null);
  const isAuto = !project.statusOverride;
  const effectiveStatus = getEffectiveStatus(project, events);
  const autoStatus = computeAutoStatus(project, events);

  function handleImagePick(e) {
    const file = e.target.files && e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = () => onUpdateProject(project.id, { image: reader.result });
      reader.readAsDataURL(file);
    }
    e.target.value = "";
  }

  function handleStatusChange(e) {
    const val = e.target.value;
    onUpdateProject(project.id, { statusOverride: val === "auto" ? null : val });
  }

  return (
    <div>
      <button onClick={onBack} className="inline-flex items-center gap-1.5 text-sm mb-5 transition-opacity hover:opacity-70" style={{ color: "#8b93a7" }}>
        <ArrowLeft size={16} /> Zurück zu Projekten
      </button>

      <div className="rounded-2xl overflow-hidden mb-6" style={{ background: "rgba(255,255,255,0.035)", border: "1px solid rgba(255,255,255,0.08)" }}>
        <div
          className="h-36 relative flex items-end p-5 overflow-hidden"
          style={!project.image ? { background: `radial-gradient(120% 160% at 10% 0%, ${tokens.dim}, transparent 65%)` } : undefined}
        >
          {project.image ? (
            <>
              <img src={project.image} alt="" className="absolute inset-0 h-full w-full object-cover" />
              <div className="absolute inset-0" style={{ background: "linear-gradient(180deg, rgba(10,14,26,0.15) 0%, rgba(10,14,26,0.85) 100%)" }} />
            </>
          ) : (
            <div className="absolute inset-0 opacity-30" style={{ backgroundImage: `radial-gradient(${tokens.accent}33 1px, transparent 1px)`, backgroundSize: "16px 16px" }} />
          )}
          <div className="relative flex items-end justify-between w-full">
            <div>
              <h1 className="text-2xl font-bold mb-2" style={{ fontFamily: "'Rajdhani',sans-serif", color: "#fff", letterSpacing: "0.3px" }}>
                {project.name}
              </h1>
              <StatusPill status={effectiveStatus} />
            </div>
            <div className="flex items-center gap-1.5 flex-shrink-0">
              <button
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                className="relative rounded-lg p-2 transition-colors hover:bg-white/10"
                style={{ color: "#8b93a7" }}
                title={project.image ? "Bild ändern" : "Bild hochladen"}
              >
                <ImagePlus size={16} />
              </button>
              <button
                onClick={() => onDeleteProject(project.id)}
                className="relative rounded-lg p-2 transition-colors hover:bg-white/10"
                style={{ color: "#8b93a7" }}
                title="Projekt löschen"
              >
                <Trash2 size={16} />
              </button>
              <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={handleImagePick} />
            </div>
          </div>
        </div>
        <div className="p-5">
          <div className="flex items-center justify-between mb-1.5 text-xs" style={{ color: "#8b93a7" }}>
            <span>Fortschritt</span>
            <span style={{ color: tokens.accent }}>{project.progress}%</span>
          </div>
          <ProgressBar value={project.progress} color={project.color} />

          <div className="flex items-center justify-between mt-4 text-xs" style={{ color: "#8b93a7" }}>
            <span>Status</span>
            {isAuto && <span>Automatisch berechnet</span>}
          </div>
          <select
            value={project.statusOverride || "auto"}
            onChange={handleStatusChange}
            className="w-full mt-1.5 rounded-lg px-3 py-2 text-sm outline-none"
            style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", color: "#eef1f8", colorScheme: "dark" }}
          >
            <option value="auto">Automatisch ({STATUS_CONFIG[autoStatus].label})</option>
            {Object.entries(STATUS_CONFIG).map(([key, cfg]) => (
              <option key={key} value={key}>{cfg.label} (manuell)</option>
            ))}
          </select>
        </div>
      </div>

      <div className="flex items-center justify-between mb-3">
        <h2 className="text-sm font-semibold uppercase tracking-wide" style={{ color: "#8b93a7" }}>Termine &amp; Tasks</h2>
        <button
          onClick={() => onAddEvent(project.id)}
          className="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold transition-transform hover:scale-105"
          style={{ background: tokens.grad, color: "#0a0e1a" }}
        >
          <Plus size={14} strokeWidth={2.5} /> Hinzufügen
        </button>
      </div>

      <div className="space-y-2">
        {open.length === 0 && done.length === 0 && (
          <div className="rounded-xl py-8 text-center text-sm" style={{ color: "#8b93a7", border: "1px dashed rgba(255,255,255,0.1)" }}>
            Noch keine Termine oder Tasks — leg den ersten mit "Hinzufügen" an.
          </div>
        )}
        {open.map((ev) => (
          <EventRow key={ev.id} ev={ev} project={project} onToggleDone={onToggleDone} showProject={false} />
        ))}
        {done.length > 0 && (
          <>
            <div className="text-xs font-semibold uppercase tracking-wide pt-3 pb-1" style={{ color: "#8b93a7" }}>Erledigt</div>
            {done.map((ev) => (
              <EventRow key={ev.id} ev={ev} project={project} onToggleDone={onToggleDone} showProject={false} />
            ))}
          </>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   GLOBALE KALENDER-/TIMELINE-ANSICHT
   ============================================================ */
function TimelineView({ events, projectsById, onToggleDone, onAddEvent }) {
  const upcoming = events
    .filter((e) => !e.done)
    .sort((a, b) => a.date.localeCompare(b.date) || (a.time || "99:99").localeCompare(b.time || "99:99"));

  const groups = [];
  upcoming.forEach((ev) => {
    const last = groups[groups.length - 1];
    if (last && last.date === ev.date) last.items.push(ev);
    else groups.push({ date: ev.date, items: [ev] });
  });

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-sm font-semibold uppercase tracking-wide" style={{ color: "#8b93a7" }}>Anstehend — alle Projekte</h2>
        <button

/* ============================================================
   HAUPTKOMPONENTE
   ============================================================ */
/* ============================================================
   GOOGLE DRIVE SYNC — sichert Projekte & Termine automatisch in einer
   JSON-Datei im eigenen Google Drive des Nutzers (Scope "drive.file": die
   App sieht NUR Dateien, die sie selbst angelegt hat). Nutzt bewusst
   dieselbe OAuth-Client-ID und denselben Sync-Ansatz (Google Identity
   Services + Multipart-Upload) wie Kalender und Trading Journal.
   ============================================================ */
const DRIVE_CLIENT_ID = "273314490848-f25ar1ji7u1iudbnir425ai1vivaonvn.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE_FILENAME = "projekte-julian-backup.json";
const LS_DRIVE_FILEID = "pj_drivefileid_v1";
const LS_DRIVE_CONNECTED = "pj_driveconnected_v1";
const LS_DRIVE_LASTSYNC = "pj_drivelastsync_v1";

function useDriveSync(getPayload, applyPayload) {
  const [status, setStatus] = useState({ connected: false, syncing: false, lastSync: null });
  const tokenClientRef = useRef(null);
  const accessTokenRef = useRef(null);
  const expiresAtRef = useRef(0);
  const saveTimerRef = useRef(null);
  const connectedRef = useRef(false);
  const syncingRef = useRef(false);

  function setConnected(v) { connectedRef.current = v; setStatus((s) => ({ ...s, connected: v })); }
  function setSyncing(v) { syncingRef.current = v; setStatus((s) => ({ ...s, syncing: v })); }
  function setLastSync(t) { setStatus((s) => ({ ...s, lastSync: t })); }

  function buildMultipart(metadata, content) {
    const boundary = "pj_drive_boundary_" + Date.now();
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${content}\r\n` +
      `--${boundary}--`;
    return { body, contentType: `multipart/related; boundary=${boundary}` };
  }

  async function findFile() {
    const cachedId = localStorage.getItem(LS_DRIVE_FILEID);
    if (cachedId) {
      const check = await fetch(`https://www.googleapis.com/drive/v3/files/${cachedId}?fields=id`, {
        headers: { Authorization: `Bearer ${accessTokenRef.current}` },
      });
      if (check.ok) return cachedId;
      localStorage.removeItem(LS_DRIVE_FILEID);
    }
    const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
      headers: { Authorization: `Bearer ${accessTokenRef.current}` },
    });
    const data = await res.json();
    if (data.files && data.files.length > 0) {
      localStorage.setItem(LS_DRIVE_FILEID, data.files[0].id);
      return data.files[0].id;
    }
    return null;
  }

  async function saveNow() {
    if (syncingRef.current) return;
    setSyncing(true);
    try {
      await ensureFreshToken();
      const content = JSON.stringify(getPayload());
      const fileId = await findFile();
      const { body, contentType } = buildMultipart({ name: DRIVE_FILENAME, mimeType: "application/json" }, content);
      const url = fileId
        ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
        : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
      const res = await fetch(url, {
        method: fileId ? "PATCH" : "POST",
        headers: { Authorization: `Bearer ${accessTokenRef.current}`, "Content-Type": contentType },
        body,
      });
      const data = await res.json();
      if (data.id) localStorage.setItem(LS_DRIVE_FILEID, data.id);
      const now = Date.now();
      localStorage.setItem(LS_DRIVE_LASTSYNC, String(now));
      setLastSync(now);
    } catch (err) {
      console.error("Drive-Sicherung fehlgeschlagen:", err);
    } finally {
      setSyncing(false);
    }
  }

  // Lädt einen vorhandenen Drive-Stand. Gibt true zurück, wenn eine Datei gefunden und
  // (nach Bestätigung, falls gefordert) geladen wurde — sonst false, damit der Aufrufer
  // weiß, dass stattdessen ein initialer Upload nötig ist.
  async function loadNow(askConfirm) {
    try {
      await ensureFreshToken();
      const fileId = await findFile();
      if (!fileId) return false;
      const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { Authorization: `Bearer ${accessTokenRef.current}` },
      });
      const data = await res.json();
      if (!data || !Array.isArray(data.projects) || !Array.isArray(data.events)) return false;
      if (askConfirm && !window.confirm("Daten aus Google Drive laden? Das ersetzt deine aktuellen lokalen Projekte & Termine.")) return true;
      applyPayload(data);
      const now = Date.now();
      localStorage.setItem(LS_DRIVE_LASTSYNC, String(now));
      setLastSync(now);
      return true;
    } catch (err) {
      console.error("Laden aus Drive fehlgeschlagen:", err);
      return false;
    }
  }

  function ensureFreshToken() {
    return new Promise((resolve, reject) => {
      if (accessTokenRef.current && Date.now() < expiresAtRef.current) { resolve(accessTokenRef.current); return; }
      if (!tokenClientRef.current) { reject(new Error("Google-Anmeldung noch nicht bereit")); return; }
      const prev = tokenClientRef.current.callback;
      tokenClientRef.current.callback = (resp) => {
        tokenClientRef.current.callback = prev;
        onTokenResponse(resp);
        if (resp && !resp.error) resolve(resp.access_token); else reject(new Error("Google-Anmeldung abgelaufen"));
      };
      tokenClientRef.current.requestAccessToken({ prompt: "" });
    });
  }

  async function onTokenResponse(resp) {
    if (!resp || resp.error) { setConnected(false); return; }
    accessTokenRef.current = resp.access_token;
    expiresAtRef.current = Date.now() + (parseInt(resp.expires_in, 10) || 3500) * 1000 - 60000;
    setConnected(true);
    localStorage.setItem(LS_DRIVE_CONNECTED, "1");
    setTimeout(() => {
      if (connectedRef.current && tokenClientRef.current) tokenClientRef.current.requestAccessToken({ prompt: "" });
    }, Math.max(expiresAtRef.current - Date.now() - 300000, 60000));
    // Ein vorhandenes Drive-Backup gewinnt immer gegen den lokalen Stand (der ohne
    // Backup nur die Demo-Projekte wäre) — nur wenn wirklich noch nichts in Drive liegt,
    // wird der aktuelle lokale Stand als allererstes Backup hochgeladen.
    const found = await loadNow(false);
    if (!found) saveNow();
  }

  useEffect(() => {
    let tries = 0;
    function init() {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) {
        tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
          client_id: DRIVE_CLIENT_ID,
          scope: DRIVE_SCOPE,
          callback: onTokenResponse,
        });
        if (localStorage.getItem(LS_DRIVE_CONNECTED) === "1") {
          tokenClientRef.current.requestAccessToken({ prompt: "" });
        }
        return;
      }
      if (tries < 50) { tries += 1; setTimeout(init, 200); }
    }
    init();
  }, []);

  function connect() {
    if (tokenClientRef.current) tokenClientRef.current.requestAccessToken({});
  }
  function disconnect() {
    setConnected(false);
    localStorage.removeItem(LS_DRIVE_CONNECTED);
    accessTokenRef.current = null;
  }
  function scheduleSave() {
    if (!connectedRef.current) return;
    clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(saveNow, 4000);
  }

  return { status, connect, disconnect, scheduleSave, loadNow: () => loadNow(true) };
}

function ProjekteDashboard() {
  const [projects, setProjects] = useState(initialProjects);
  const [events, setEvents] = useState(initialEvents);
  const [selectedProjectId, setSelectedProjectId] = useState(null);
  const [tab, setTab] = useState("projects"); // 'projects' | 'timeline'
  const [search, setSearch] = useState("");
  const [eventModalProjectId, setEventModalProjectId] = useState(undefined); // undefined = geschlossen, null/id = offen
  const [showProjectModal, setShowProjectModal] = useState(false);

  // Refs mit dem jeweils aktuellsten Stand — so bekommt der Drive-Sync-Hook (der seinen
  // Google-Callback nur einmal beim Start einrichtet) immer die frischen Daten, statt an
  // einem alten Stand von damals festzuhängen.
  const projectsRef = useRef(projects);
  const eventsRef = useRef(events);
  useEffect(() => { projectsRef.current = projects; }, [projects]);
  useEffect(() => { eventsRef.current = events; }, [events]);

  const drive = useDriveSync(
    () => ({ projects: projectsRef.current, events: eventsRef.current }),
    (data) => { setProjects(data.projects); setEvents(data.events); }
  );
  // Bei jeder Änderung an Projekten/Terminen (debounced 4s) automatisch nach Drive
  // sichern — genauso wie im Kalender und Trading Journal.
  useEffect(() => { drive.scheduleSave(); }, [projects, events]);

  const projectsById = useMemo(() => Object.fromEntries(projects.map((p) => [p.id, p])), [projects]);

  const eventsByProject = useMemo(() => {
    const map = {};
    projects.forEach((p) => (map[p.id] = []));
    events.forEach((e) => { if (e.projectId && map[e.projectId]) map[e.projectId].push(e); });
    return map;
  }, [projects, events]);

  const filteredProjects = projects.filter((p) => p.name.toLowerCase().includes(search.toLowerCase()));

  function toggleDone(id) {
    setEvents((prev) => prev.map((e) => (e.id === id ? { ...e, done: !e.done } : e)));
  }

  function addEvent(newEv) {
    setEvents((prev) => [...prev, { id: uid(), done: false, ...newEv }]);
    setEventModalProjectId(undefined);
  }

  function addProject(newProj) {
    setProjects((prev) => [...prev, { id: uid(), ...newProj }]);
    setShowProjectModal(false);
  }

  function updateProject(id, patch) {
    setProjects((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  }

  function deleteProject(id) {
    setProjects((prev) => prev.filter((p) => p.id !== id));
    setEvents((prev) => prev.map((e) => (e.projectId === id ? { ...e, projectId: null } : e)));
    setSelectedProjectId(null);
  }

  const selectedProject = selectedProjectId ? projectsById[selectedProjectId] : null;

  return (
    <div
      className="min-h-screen w-full p-6 md:p-10"
      style={{
        background:
          "radial-gradient(1100px 750px at 10% -8%, rgba(124,92,255,0.16), transparent 60%)," +
          "radial-gradient(950px 700px at 92% 8%, rgba(54,198,255,0.12), transparent 55%)," +
          "radial-gradient(900px 800px at 50% 115%, rgba(255,61,154,0.08), transparent 60%)," +
          "#0a0e1a",
        fontFamily: "'Inter',sans-serif",
        color: "#eef1f8",
      }}
    >
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');`}</style>

      <div className="max-w-6xl mx-auto">
        {!selectedProject ? (
          <>
            {/* Kopfzeile */}
            <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
              <div>
                <h1 className="text-3xl font-bold" style={{ fontFamily: "'Rajdhani',sans-serif", letterSpacing: "0.3px" }}>
                  Projekte
                </h1>
                <p className="text-sm mt-1" style={{ color: "#8b93a7" }}>
                  {projects.length} Projekte · {events.filter((e) => !e.done).length} offene Termine &amp; Tasks
                </p>
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <button
                  onClick={drive.status.connected ? drive.disconnect : drive.connect}
                  title={drive.status.connected ? "Google Drive trennen" : "Mit Google Drive verbinden — sichert Projekte & Termine automatisch"}
                  className="inline-flex items-center gap-1.5 rounded-lg px-3 py-2.5 text-xs font-semibold transition-colors"
                  style={
                    drive.status.connected
                      ? { background: "rgba(43,217,185,0.14)", border: "1px solid rgba(43,217,185,0.4)", color: "#2bd9b9" }
                      : { background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.12)", color: "#8b93a7" }
                  }
                >
                  {drive.status.syncing ? (
                    <Loader size={14} className="animate-spin" />
                  ) : drive.status.connected ? (
                    <CheckCircle2 size={14} />
                  ) : (
                    <Cloud size={14} />
                  )}
                  {drive.status.connected
                    ? `Google Drive${drive.status.lastSync ? " · " + new Date(drive.status.lastSync).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : ""}`
                    : "Google Drive verbinden"}
                </button>
                <button
                  onClick={() => setShowProjectModal(true)}
                  className="inline-flex items-center gap-1.5 rounded-lg px-4 py-2.5 text-sm font-semibold transition-transform hover:scale-105"
                  style={{ background: "linear-gradient(135deg,#8b7bff,#5b4fe0)", color: "#0a0e1a" }}
                >
                  <Plus size={16} strokeWidth={2.5} /> Neues Projekt
                </button>
              </div>
            </div>

            {/* Tabs + Suche */}
            <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
              <div className="inline-flex rounded-xl p-1" style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)" }}>
                <button
                  onClick={() => setTab("projects")}
                  className="inline-flex items-center gap-1.5 rounded-lg px-3.5 py-1.5 text-xs font-semibold transition-colors"
                  style={tab === "projects" ? { background: "rgba(124,92,255,0.2)", color: "#a996ff" } : { color: "#8b93a7" }}
                >
                  <LayoutGrid size={14} /> Projekte
                </button>
                <button
                  onClick={() => setTab("timeline")}
                  className="inline-flex items-center gap-1.5 rounded-lg px-3.5 py-1.5 text-xs font-semibold transition-colors"
                  style={tab === "timeline" ? { background: "rgba(124,92,255,0.2)", color: "#a996ff" } : { color: "#8b93a7" }}
                >
                  <CalendarClock size={14} /> Kalender
                </button>
              </div>

              {tab === "projects" && (
                <div className="relative">
                  <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: "#8b93a7" }} />
                  <input
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="Projekt suchen…"
                    className="rounded-lg pl-8 pr-3 py-2 text-sm outline-none w-48"
                    style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", color: "#eef1f8" }}
                  />
                </div>
              )}
            </div>

            {tab === "projects" ? (
              <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3">
                {filteredProjects.map((p) => {
                  const projEvents = eventsByProject[p.id] || [];
                  const openEvents = projEvents.filter((e) => !e.done);
                  const nextDue = openEvents.map((e) => e.date).sort()[0];
                  return (
                    <ProjectCard
                      key={p.id}
                      project={p}
                      status={getEffectiveStatus(p, projEvents)}
                      nextDue={nextDue}
                      openCount={openEvents.length}
                      onOpen={setSelectedProjectId}
                    />
                  );
                })}
                {filteredProjects.length === 0 && (
                  <div className="col-span-full rounded-xl py-10 text-center text-sm" style={{ color: "#8b93a7", border: "1px dashed rgba(255,255,255,0.1)" }}>
                    Kein Projekt gefunden für "{search}".
                  </div>
                )}
              </div>
            ) : (
              <TimelineView
                events={events}
                projectsById={projectsById}
                onToggleDone={toggleDone}
                onAddEvent={setEventModalProjectId}
              />
            )}
          </>
        ) : (
          <ProjectDetail
            project={selectedProject}
            events={eventsByProject[selectedProject.id] || []}
            onBack={() => setSelectedProjectId(null)}
            onToggleDone={toggleDone}
            onAddEvent={setEventModalProjectId}
            onDeleteProject={deleteProject}
            onUpdateProject={updateProject}
          />
        )}
      </div>

      {eventModalProjectId !== undefined && (
        <EventModal
          projects={projects}
          defaultProjectId={eventModalProjectId}
          onSave={addEvent}
          onClose={() => setEventModalProjectId(undefined)}
        />
      )}
      {showProjectModal && <ProjectModal onSave={addProject} onClose={() => setShowProjectModal(false)} />}
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<ProjekteDashboard />);
window.__projekteMounted = true;
const bootStatus = document.getElementById('boot-status');
if(bootStatus) bootStatus.remove();
</script>
</body>
</html>
