<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>JMB Headquarter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Rajdhani:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ELITE-EDITION — reines Schwarz, dünne Haarlinien statt dicker
     Chrome-Balken, scharfe (ungerundete) Kanten, Serifen-Wordmark
     mit engem/weitem Kerning wie bei Luxus-Labels, ruhige statt
     lauter Animationen. Ein einziger Platin-Akzent statt Vielfarbigkeit.
     ============================================================ */
  :root{
    --bg:#020202;
    --bg-dot: rgba(255,255,255,.038);
    --panel-a:#0d0d0d;
    --panel-b:#020202;
    --hair:rgba(235,235,238,.22);   /* Standard-Haarlinie */
    --hair-strong:rgba(235,235,238,.55);
    --platin:#e7e6e2;               /* einziger Metall-/Lichtton, kein Verlauf-Overkill */
    --platin-dim:#a9a8a2;
    --ink:#eeeeec;
    --muted:#8d8d89;
    --muted2:#525250;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    font-weight:300;
    overflow:hidden;
  }

  /* ---------- Hintergrund: gepunktete "Globus"-Textur + weicher Silber-Glow,
     kreisförmig maskiert, exakt wie der Globus hinter dem RT-Logo ---------- */
  .bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .bgfx__grid{
    position:absolute;inset:-10%;
    background-image: radial-gradient(var(--bg-dot) 1.3px, transparent 1.5px);
    background-size:14px 14px;
    -webkit-mask-image:radial-gradient(circle at 50% 42%, rgba(0,0,0,.95), transparent 66%);
    mask-image:radial-gradient(circle at 50% 42%, rgba(0,0,0,.95), transparent 66%);
  }
  .bgfx__ring{
    position:absolute; top:50%; left:50%; width:min(78vmin,780px); height:min(78vmin,780px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:.5px solid rgba(255,255,255,.045);
  }
  .bgfx__ring::before{
    content:"";position:absolute;inset:34px;border-radius:50%;border:.5px solid rgba(255,255,255,.03);
  }
  .bgfx__glow{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(130px);opacity:.055;background:radial-gradient(circle, #ffffff, transparent 62%);}
  .bgfx__glow--a{top:-24%;left:-18%;}
  .bgfx__glow--b{bottom:-28%;right:-18%;}

  /* ---------- Views (Start / App) ---------- */
  .view{
    position:fixed;inset:0;z-index:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .5s ease;
  }
  .view.is-active{opacity:1;visibility:visible;pointer-events:auto;}

  /* ---------- Startseite ---------- */
  .hub-header{text-align:center;margin-bottom:clamp(2.8rem, 7vh, 4.2rem);}
  .hub-eyebrow{
    display:block;font-family:'Rajdhani', sans-serif;font-weight:500;
    font-size:.62rem;letter-spacing:.5em;text-transform:uppercase;
    color:var(--muted2);margin:0 0 .9rem;padding-left:.5em; /* optischer Ausgleich für Letter-Spacing */
  }
  .hub-header h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(2.1rem, 5vw, 3.4rem);
    letter-spacing:.09em;
    margin:0 0 1.4rem;
    color:var(--platin);
    text-shadow:0 0 22px rgba(255,255,255,.08);
  }
  /* Dünne Haarlinien-Flourishes links/rechts vom Titel */
  .hub-header h1{display:flex;align-items:center;gap:1.1em;justify-content:center;}
  .hub-header h1::before, .hub-header h1::after{
    content:"";flex:0 0 clamp(36px, 7vw, 84px);height:.5px;
    background:linear-gradient(90deg, transparent, var(--hair-strong));
  }
  .hub-header h1::after{background:linear-gradient(90deg, var(--hair-strong), transparent);}

  .hud-clock{display:flex;flex-direction:column;align-items:center;gap:.35rem;}
  .hud-clock__time{
    font-family:'Rajdhani', monospace;
    font-weight:400;
    font-size:.92rem;
    letter-spacing:.3em;
    padding-left:.3em;
    color:var(--muted);
  }
  .hud-clock__date{font-size:.62rem;color:var(--muted2);letter-spacing:.28em;padding-left:.28em;text-transform:uppercase;}

  .hex-row{
    display:flex;
    gap:clamp(1rem, 3vw, 2.2rem);
    flex-wrap:wrap;
    justify-content:center;
    padding:0 1.2rem;
  }

  .hex{
    position:relative;
    width:clamp(230px, 22vw, 300px);
    height:clamp(230px, 22vw, 280px);
    border:none;background:none;padding:0;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    opacity:0;transform:translateY(6px);
    animation:hexIn .9s cubic-bezier(.16,.8,.2,1) forwards;
    transition:transform .5s cubic-bezier(.16,.8,.2,1);
  }
  .hex:nth-child(2){animation-delay:.1s;}
  .hex:nth-child(3){animation-delay:.2s;}
  .hex:hover, .hex:focus-visible{transform:translateY(-4px);z-index:2;}
  .hex:hover .hex__inner, .hex:focus-visible .hex__inner{border-color:var(--hair-strong);background:linear-gradient(165deg, rgba(20,20,20,.75), rgba(2,2,2,.9));}
  .hex:hover .hex__icon, .hex:focus-visible .hex__icon{opacity:1;}
  .hex:hover .hex__accent, .hex:focus-visible .hex__accent{width:100%;}
  .hex:focus-visible{outline:none;}
  .hex:focus-visible .hex__inner{border-color:var(--platin);}
  .hex--disabled{cursor:default;}
  .hex--disabled:hover{transform:none;}

  /* Scharfe Rechteck-Karte statt Hexagon: klar sichtbare 1px-Kontur (kein
     dicker Rahmen, aber deutlich präsenter als eine reine Haarlinie), mit
     dünnem Unterlinien-Akzent, der beim Hover/Fokus von der Mitte aus
     komplett auffährt — die Trennlinien-Optik aus dem Logo, als Interaktion. */
  .hex__inner{
    position:absolute;inset:0;
    background:linear-gradient(165deg, rgba(13,13,13,.62), rgba(2,2,2,.88));
    border:1px solid rgba(235,235,238,.4);
    transition:border-color .4s ease, background .4s ease;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.85rem;padding:1.4rem;text-align:center;
  }
  .hex__inner::before, .hex__inner::after{
    /* Feine Eckmarken oben links / unten rechts — technisches Detail statt
       Vollrahmen-Wucht, dient auch als optischer Ersatz für die Hexagon-Spitzen. */
    content:"";position:absolute;width:14px;height:14px;pointer-events:none;
  }
  .hex__inner::before{top:-1px;left:-1px;border-top:1px solid var(--platin);border-left:1px solid var(--platin);}
  .hex__inner::after{bottom:-1px;right:-1px;border-bottom:1px solid var(--platin);border-right:1px solid var(--platin);}
  /* Je Kachel eine eigene Akzentfarbe (per --accent-Variable am Button gesetzt) —
     nur die Hover-Unterlinie ist farbig, der Rest bleibt monochrom. */
  .hex__accent{
    position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    width:0;height:2px;background:var(--accent, var(--platin));
    box-shadow:0 0 12px 1px var(--accent, rgba(255,255,255,.4));
    transition:width .5s cubic-bezier(.16,.8,.2,1);
  }
  .hex__icon{
    width:30px;height:30px;position:relative;z-index:1;color:var(--platin);
    opacity:.72;transition:opacity .4s ease;stroke-width:1.1;
  }
  .hex__title, .hex__sub{position:relative;z-index:1;}
  .hex__title{
    font-family:'Rajdhani', sans-serif;
    font-weight:500;font-size:.86rem;color:var(--ink);
    letter-spacing:.34em; text-transform:uppercase;
    padding-left:.34em;
  }
  .hex__title::after{
    content:"";display:block;width:22px;height:.5px;background:var(--hair-strong);
    margin:.7rem auto 0;
  }
  .hex__sub{
    font-family:'Cormorant Garamond', serif;font-style:italic;
    font-size:.92rem;color:var(--muted);max-width:18ch;line-height:1.5;
  }

  .status-strip{
    display:flex;gap:2.4rem;flex-wrap:wrap;justify-content:center;
    margin-top:clamp(2.2rem, 6vh, 3.4rem);
    font-family:'Rajdhani', sans-serif;
    font-size:.6rem;color:var(--muted2);letter-spacing:.32em;text-transform:uppercase;
  }
  .status-strip span{display:inline-flex;align-items:center;gap:.6rem;padding-left:.32em;}
  .status-dot{width:3px;height:3px;border-radius:50%;background:var(--platin-dim);animation:dotPulse 3.4s ease-in-out infinite;}
  .status-strip span:nth-child(2) .status-dot{animation-delay:.8s;}
  .status-strip span:nth-child(3) .status-dot{animation-delay:1.6s;}

  /* ---------- App-Ansicht ---------- */
  .view--app{justify-content:flex-start;}
  .app-frame-wrap{position:relative;width:100%;height:100%;}
  #appFrame{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg);}

  .back-btn{
    position:fixed;top:22px;left:22px;z-index:5;
    width:44px;height:44px;border:none;background:none;cursor:pointer;padding:0;
    transition:transform .3s ease;
  }
  .back-btn:hover, .back-btn:focus-visible{transform:translateX(-2px);}
  .back-btn:hover .back-btn__inner, .back-btn:focus-visible .back-btn__inner{border-color:var(--hair-strong);}
  .back-btn:focus-visible{outline:none;}
  .back-btn__inner{
    position:absolute;inset:0;
    clip-path:polygon(25% 2%, 75% 2%, 100% 50%, 75% 98%, 25% 98%, 0% 50%);
    background:linear-gradient(165deg, var(--panel-a), var(--panel-b));
    border:1px solid var(--hair);
    transition:border-color .3s ease;
    display:flex;align-items:center;justify-content:center;color:var(--platin-dim);
  }

  .loader{
    position:absolute;inset:0;z-index:4;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;
    background:var(--bg);opacity:0;pointer-events:none;transition:opacity .4s ease;
  }
  .loader.is-visible{opacity:1;}
  .loader__ring{
    width:26px;height:26px;border-radius:50%;
    border:1px solid rgba(255,255,255,.14);
    border-top-color:var(--platin-dim);
    animation:spin 1.1s linear infinite;
  }
  .loader__text{font-family:'Rajdhani', sans-serif;font-size:.62rem;color:var(--muted2);letter-spacing:.32em;padding-left:.32em;text-transform:uppercase;}

  /* ---------- Speichern-Bestätigung beim Verlassen einer App ---------- */
  .confirm-overlay{
    position:fixed;inset:0;z-index:30;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease;
  }
  .confirm-overlay.is-active{opacity:1;visibility:visible;pointer-events:auto;}
  .confirm-box{
    background:linear-gradient(165deg, var(--panel-a), var(--panel-b));
    border:1px solid var(--hair); border-radius:0;
    padding:2rem 2.6rem; text-align:center; max-width:320px;
    box-shadow:0 30px 70px rgba(0,0,0,.65);
    transform:translateY(6px); transition:transform .3s ease;
  }
  .confirm-overlay.is-active .confirm-box{transform:translateY(0);}
  .confirm-box p{
    margin:0 0 1.5rem;font-family:'Cormorant Garamond', serif;font-style:italic;
    font-size:1.15rem;color:var(--ink);line-height:1.4;
  }
  .confirm-yes{
    font-family:'Rajdhani', sans-serif; font-weight:500; font-size:.68rem; letter-spacing:.32em;
    text-transform:uppercase; padding-left:.32em;
    color:var(--bg); background:var(--platin);
    border:none; border-radius:0; padding:.75rem 2.4rem; cursor:pointer;
    transition:opacity .2s ease;
  }
  .confirm-yes:hover, .confirm-yes:focus-visible{opacity:.82;}

  @keyframes hexIn{to{opacity:1;transform:scale(1);}}
  @keyframes dotPulse{0%,100%{opacity:.45;}50%{opacity:1;}}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important;}
  }

  @media (max-width:560px){
    .hex-row{gap:1.4rem;}
    body{overflow-y:auto;}
    .hub-header h1::before, .hub-header h1::after{flex-basis:20px;}
  }
</style>
</head>
<body>

  <div class="bgfx" aria-hidden="true">
    <div class="bgfx__grid"></div>
    <div class="bgfx__ring"></div>
    <div class="bgfx__glow bgfx__glow--a"></div>
    <div class="bgfx__glow bgfx__glow--b"></div>
  </div>

  <main id="home" class="view view--home">
    <div class="hub-header">
      <span class="hub-eyebrow">Private Kommandozentrale</span>
      <h1>JMB Headquarter</h1>
      <div class="hud-clock">
        <span class="hud-clock__time" id="hudTime">--:--:--</span>
        <span class="hud-clock__date" id="hudDate">-- --- ----</span>
      </div>
    </div>

    <div class="hex-row">
      <button class="hex" data-target="kalender" type="button" style="--accent:#3b82f6;">
        <span class="hex__inner">
          <svg class="hex__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="10" width="36" height="32" rx="3"/>
            <line x1="6" y1="19" x2="42" y2="19"/>
            <line x1="15" y1="6" x2="15" y2="14"/>
            <line x1="33" y1="6" x2="33" y2="14"/>
            <circle cx="15" cy="27" r="1.6" fill="currentColor" stroke="none"/>
            <circle cx="24" cy="27" r="1.6" fill="currentColor" stroke="none"/>
            <circle cx="33" cy="27" r="1.6" fill="currentColor" stroke="none"/>
            <circle cx="15" cy="35" r="1.6" fill="currentColor" stroke="none"/>
            <circle cx="24" cy="35" r="1.6" fill="currentColor" stroke="none"/>
          </svg>
          <span class="hex__title">Kalender</span>
          <span class="hex__sub">Termine & Zeitplanung</span>
        </span>
        <span class="hex__accent"></span>
      </button>

      <button class="hex" data-target="journal" type="button" style="--accent:#a855f7;">
        <span class="hex__inner">
          <svg class="hex__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="6" x2="12" y2="16"/>
            <rect x="8" y="16" width="8" height="14"/>
            <line x1="12" y1="30" x2="12" y2="41"/>
            <line x1="24" y1="10" x2="24" y2="18"/>
            <rect x="20" y="18" width="8" height="10" fill="currentColor" stroke="none"/>
            <line x1="24" y1="28" x2="24" y2="38"/>
            <line x1="36" y1="4" x2="36" y2="14"/>
            <rect x="32" y="14" width="8" height="16"/>
            <line x1="36" y1="30" x2="36" y2="43"/>
          </svg>
          <span class="hex__title">Trading Journal</span>
          <span class="hex__sub">Trades & Performance</span>
        </span>
        <span class="hex__accent"></span>
      </button>

      <button class="hex" data-target="projekte" type="button" style="--accent:#ef4444;">
        <span class="hex__inner">
          <svg class="hex__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 14a3 3 0 0 1 3-3h8l4 5h18a3 3 0 0 1 3 3v16a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V14z"/>
          </svg>
          <span class="hex__title">Projekte</span>
          <span class="hex__sub">Projekte & Tasks</span>
        </span>
        <span class="hex__accent"></span>
      </button>

      <button class="hex" data-target="budgetplanner" type="button" style="--accent:#22c55e;">
        <span class="hex__inner">
          <svg class="hex__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="12" width="38" height="26" rx="2"/>
            <path d="M5 19h38"/>
            <rect x="29" y="25" width="10" height="7" rx="1.2" fill="currentColor" stroke="none"/>
          </svg>
          <span class="hex__title">Budgetplanner</span>
          <span class="hex__sub">Budget & Finanzen</span>
        </span>
        <span class="hex__accent"></span>
      </button>
    </div>

    <div class="status-strip">
      <span><span class="status-dot"></span>Kalender bereit</span>
      <span><span class="status-dot"></span>Journal bereit</span>
      <span><span class="status-dot"></span>Projekte bereit</span>
      <span><span class="status-dot"></span>Budgetplanner bereit</span>
    </div>
  </main>

  <section id="app" class="view view--app" aria-hidden="true">
    <button class="back-btn" id="backBtn" type="button" aria-label="Zurück zur Startseite">
      <span class="back-btn__inner">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 5 L7 12 L15 19"/>
        </svg>
      </span>
    </button>
    <div class="app-frame-wrap">
      <div class="loader" id="loader">
        <span class="loader__ring"></span>
        <span class="loader__text" id="loaderText">Wird geladen …</span>
      </div>
      <iframe id="appFrame" title="Eingebettete App"></iframe>
    </div>
  </section>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <p>Änderungen speichern?</p>
      <button class="confirm-yes" id="btnConfirmSave" type="button">Ja</button>
    </div>
  </div>

<script>
  const homeView = document.getElementById('home');
  const appView  = document.getElementById('app');
  const frame    = document.getElementById('appFrame');
  const loader   = document.getElementById('loader');
  const loaderText = document.getElementById('loaderText');
  const backBtn  = document.getElementById('backBtn');
  const confirmOverlay = document.getElementById('confirmOverlay');
  const btnConfirmSave = document.getElementById('btnConfirmSave');

  // Alle eingebetteten Apps speichern ihre Änderungen selbst laufend (localStorage bei
  // jeder Aktion) — die "Ja"-Bestätigung ist daher primär eine bewusste Bestätigung des
  // Nutzers und blockiert die Navigation, bis sie angeklickt wird.
  let pendingLeaveAction = null;
  function requestLeaveApp(action){
    pendingLeaveAction = action;
    confirmOverlay.classList.add('is-active');
  }
  btnConfirmSave.addEventListener('click', () => {
    confirmOverlay.classList.remove('is-active');
    const action = pendingLeaveAction; pendingLeaveAction = null;
    if(action) action();
  });

  const targets = {
    kalender: { src: 'kalender-julian.html', label: 'Kalender wird geladen …' },
    journal:  { src: 'trading-journal-julian.html', label: 'Trading Journal wird geladen …' },
    projekte: { src: 'projekte-julian.html', label: 'Projekte werden geladen …' },
    budgetplanner: { src: 'budgetplanner-julian.html', label: 'Budgetplanner wird geladen …' }
  };

  let currentTarget = null;

  function openApp(name, pushHistory){
    const t = targets[name];
    if(!t) return;
    homeView.classList.remove('is-active');
    appView.classList.add('is-active');
    appView.setAttribute('aria-hidden', 'false');
    homeView.setAttribute('aria-hidden', 'true');

    if(currentTarget !== name){
      switchFrameTo(t.src, t.label);
      currentTarget = name;
    }
    if(pushHistory !== false) history.pushState({view:name}, '', '#' + name);
  }

  // Wechselt das iframe auf eine neue App. Vorher wird dem GERADE NOCH geladenen
  // iframe (der alten App) kurz signalisiert, dass dies ein bewusster, gewollter
  // Wechsel ist — verhindert, dass dessen nativer Browser-"Verlassen?"-Dialog
  // nochmal aufploppt, obwohl das eigene Bestätigungs-Modal (Zurück-Button) den
  // Nutzer schon gefragt hat. Da postMessage asynchron zugestellt wird (und unter
  // file:// direkter Cross-Frame-Zugriff ohnehin blockiert ist), wird auf eine
  // kurze Bestätigung der alten App gewartet, bevor wirklich gewechselt wird —
  // mit Timeout-Fallback, falls z.B. beim allerersten Laden noch kein Listener
  // im iframe existiert.
  function switchFrameTo(src, label){
    loaderText.textContent = label;
    loader.classList.add('is-visible');

    let switched = false;
    function doSwitch(){
      if(switched) return;
      switched = true;
      window.removeEventListener('message', onAck);
      frame.src = src;
    }
    function onAck(e){
      if(e.data && e.data.type === 'jmb-suppress-unload-ack') doSwitch();
    }
    window.addEventListener('message', onAck);

    try{ frame.contentWindow && frame.contentWindow.postMessage({type:'jmb-suppress-unload'}, '*'); }
    catch(err){ /* z.B. leeres/erstes iframe ohne Inhalt — Timeout unten übernimmt */ }

    setTimeout(doSwitch, 120);
  }

  function goHome(pushHistory){
    appView.classList.remove('is-active');
    homeView.classList.add('is-active');
    homeView.setAttribute('aria-hidden', 'false');
    appView.setAttribute('aria-hidden', 'true');
    if(pushHistory !== false) history.pushState({view:'home'}, '', '#');
  }

  frame.addEventListener('load', () => {
    loader.classList.remove('is-visible');
  });

  document.querySelectorAll('.hex[data-target]').forEach(btn => {
    btn.addEventListener('click', () => openApp(btn.dataset.target, true));
  });

  backBtn.addEventListener('click', () => requestLeaveApp(() => goHome(true)));

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){
      if(confirmOverlay.classList.contains('is-active')){ return; }
      if(appView.classList.contains('is-active')) requestLeaveApp(() => goHome(true));
    }
  });

  window.addEventListener('popstate', (e) => {
    const view = e.state && e.state.view;
    if(!view || view === 'home') goHome(false);
    else openApp(view, false);
  });

  function tick(){
    const now = new Date();
    document.getElementById('hudTime').textContent =
      now.toLocaleTimeString('de-DE');
    document.getElementById('hudDate').textContent =
      now.toLocaleDateString('de-DE', { weekday:'long', day:'2-digit', month:'2-digit', year:'numeric' });
  }
  tick();
  setInterval(tick, 1000);

  const startHash = location.hash.replace('#', '');
  if(targets[startHash]){
    openApp(startHash, false);
  } else {
    homeView.classList.add('is-active');
  }
</script>
</body>
</html>
