<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>JMB Headquarter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060910;
    --bg-grid: rgba(255,255,255,.035);
    --panel-a:#101a2c;
    --panel-b:#070b12;
    --cyan:#2fe3ff;
    --cyan-deep:#0aa8c2;
    --magenta:#ff3c74;
    --magenta-deep:#b3123f;
    --violet:#8b6cf0;
    --violet-deep:#5a3fc0;
    --ink:#e7f1f6;
    --muted:#8695a5;
    --muted2:#5c6b7a;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    overflow:hidden;
  }

  /* ---------- Hintergrund-Atmosphäre ---------- */
  .bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .bgfx__grid{
    position:absolute;inset:-10%;
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(circle at 50% 42%, rgba(0,0,0,.9), transparent 72%);
    mask-image:radial-gradient(circle at 50% 42%, rgba(0,0,0,.9), transparent 72%);
  }
  .bgfx__glow{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:.28;}
  .bgfx__glow--cyan{top:-22%;left:-16%;background:radial-gradient(circle, var(--cyan), transparent 60%);}
  .bgfx__glow--magenta{bottom:-26%;right:-16%;background:radial-gradient(circle, var(--magenta), transparent 60%);}

  /* ---------- Views (Start / App) ---------- */
  .view{
    position:fixed;inset:0;z-index:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .5s ease;
  }
  .view.is-active{opacity:1;visibility:visible;pointer-events:auto;}

  /* ---------- Startseite ---------- */
  .hub-header{text-align:center;margin-bottom:clamp(2.2rem, 6vh, 3.4rem);}
  .hub-header h1{
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    font-size:clamp(1.6rem, 3.4vw, 2.5rem);
    letter-spacing:.01em;
    margin:0 0 .9rem;
  }
  .hud-clock{display:flex;flex-direction:column;align-items:center;gap:.15rem;}
  .hud-clock__time{
    font-family:'Rajdhani', monospace;
    font-size:1.2rem;
    letter-spacing:.12em;
    color:var(--cyan);
    text-shadow:0 0 12px rgba(47,227,255,.45);
  }
  .hud-clock__date{font-size:.78rem;color:var(--muted2);letter-spacing:.03em;}

  .hex-row{
    display:flex;
    gap:clamp(1rem, 3vw, 2.2rem);
    flex-wrap:wrap;
    justify-content:center;
    padding:0 1.2rem;
  }

  .hex{
    position:relative;
    width:clamp(230px, 27vw, 300px);
    aspect-ratio:1.1547;
    border:none;background:none;padding:0;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    opacity:0;transform:scale(.82);
    animation:hexIn .6s cubic-bezier(.2,.7,.2,1) forwards;
    transition:filter .3s ease, transform .3s cubic-bezier(.2,.7,.2,1);
  }
  .hex:nth-child(2){animation-delay:.12s;}
  .hex:nth-child(3){animation-delay:.24s;}
  .hex--cyan{filter:drop-shadow(0 0 16px rgba(47,227,255,.32));}
  .hex--magenta{filter:drop-shadow(0 0 16px rgba(255,60,116,.32));}
  .hex--violet{filter:drop-shadow(0 0 16px rgba(139,108,240,.32));}
  .hex:hover, .hex:focus-visible{transform:scale(1.1);z-index:2;}
  .hex--cyan:hover, .hex--cyan:focus-visible{filter:drop-shadow(0 0 30px rgba(47,227,255,.6));}
  .hex--magenta:hover, .hex--magenta:focus-visible{filter:drop-shadow(0 0 30px rgba(255,60,116,.6));}
  .hex--violet:hover, .hex--violet:focus-visible{filter:drop-shadow(0 0 30px rgba(139,108,240,.6));}
  .hex:focus-visible{outline:2px solid var(--ink);outline-offset:6px;}
  .hex--disabled{cursor:default;}
  .hex--disabled:hover, .hex--disabled:focus-visible{transform:scale(1.03);}

  .hex::before{
    content:"";position:absolute;inset:0;
    clip-path:polygon(25% 2%, 75% 2%, 100% 50%, 75% 98%, 25% 98%, 0% 50%);
  }
  .hex--cyan::before{background:linear-gradient(150deg, var(--cyan), var(--cyan-deep));}
  .hex--magenta::before{background:linear-gradient(150deg, var(--magenta), var(--magenta-deep));}
  .hex--violet::before{background:linear-gradient(150deg, var(--violet), var(--violet-deep));}

  /* Glaseffekt: halbtransparentes, weich verwischtes Panel mit hellem Schimmer oben,
     damit der Rahmen (::before) als "Glaskante" durchscheint statt hart abgesetzt zu sein. */
  .hex__inner{
    position:absolute;inset:3px;
    clip-path:polygon(25% 2%, 75% 2%, 100% 50%, 75% 98%, 25% 98%, 0% 50%);
    background:linear-gradient(165deg, rgba(16,26,44,.82), rgba(7,11,18,.9));
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1), inset 0 40px 60px -40px rgba(255,255,255,.08);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.55rem;padding:1rem;text-align:center;
  }
  .hex__inner::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(155deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 40%);
    mix-blend-mode:screen;pointer-events:none;
  }
  .hex__icon{width:42px;height:42px;position:relative;z-index:1;}
  .hex__title, .hex__sub{position:relative;z-index:1;}
  .hex--cyan .hex__icon{color:var(--cyan);}
  .hex--magenta .hex__icon{color:var(--magenta);}
  .hex--violet .hex__icon{color:var(--violet);}
  .hex__title{
    font-family:'Rajdhani', sans-serif;
    font-weight:600;font-size:1.15rem;color:var(--ink);
  }
  .hex__sub{font-size:.76rem;color:var(--muted2);max-width:15ch;line-height:1.35;}

  .status-strip{
    display:flex;gap:1.6rem;flex-wrap:wrap;justify-content:center;
    margin-top:clamp(1.8rem, 5vh, 2.8rem);
    font-size:.78rem;color:var(--muted2);
  }
  .status-strip span{display:inline-flex;align-items:center;gap:.5rem;}
  .status-dot{width:7px;height:7px;border-radius:50%;animation:dotPulse 2.6s ease-in-out infinite;}
  .status-dot--cyan{background:var(--cyan);box-shadow:0 0 8px rgba(47,227,255,.8);}
  .status-dot--magenta{background:var(--magenta);box-shadow:0 0 8px rgba(255,60,116,.8);animation-delay:.6s;}
  .status-dot--violet{background:var(--violet);box-shadow:0 0 8px rgba(139,108,240,.8);animation-delay:1.2s;}

  /* ---------- App-Ansicht ---------- */
  .view--app{justify-content:flex-start;}
  .app-frame-wrap{position:relative;width:100%;height:100%;}
  #appFrame{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg);}

  .back-btn{
    position:fixed;top:18px;left:18px;z-index:5;
    width:52px;height:52px;border:none;background:none;cursor:pointer;padding:0;
    filter:drop-shadow(0 0 10px rgba(47,227,255,.4));
    transition:filter .2s ease, transform .2s ease;
  }
  .back-btn:hover, .back-btn:focus-visible{filter:drop-shadow(0 0 18px rgba(47,227,255,.65));transform:translateX(-2px);}
  .back-btn:focus-visible{outline:2px solid var(--ink);outline-offset:4px;}
  .back-btn::before{
    content:"";position:absolute;inset:0;
    clip-path:polygon(25% 2%, 75% 2%, 100% 50%, 75% 98%, 25% 98%, 0% 50%);
    background:linear-gradient(150deg, var(--cyan), var(--cyan-deep));
  }
  .back-btn__inner{
    position:absolute;inset:2px;
    clip-path:polygon(25% 2%, 75% 2%, 100% 50%, 75% 98%, 25% 98%, 0% 50%);
    background:linear-gradient(165deg, var(--panel-a), var(--panel-b));
    display:flex;align-items:center;justify-content:center;color:var(--cyan);
  }

  .loader{
    position:absolute;inset:0;z-index:4;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;
    background:var(--bg);opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .loader.is-visible{opacity:1;}
  .loader__ring{
    width:38px;height:38px;border-radius:50%;
    border:3px solid rgba(255,255,255,.12);
    border-top-color:var(--cyan);
    animation:spin .8s linear infinite;
  }
  .loader__text{font-size:.8rem;color:var(--muted2);letter-spacing:.03em;}

  /* ---------- Speichern-Bestätigung beim Verlassen einer App ---------- */
  .confirm-overlay{
    position:fixed;inset:0;z-index:30;
    display:flex;align-items:center;justify-content:center;
    background:rgba(3,5,10,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease;
  }
  .confirm-overlay.is-active{opacity:1;visibility:visible;pointer-events:auto;}
  .confirm-box{
    background:linear-gradient(165deg, var(--panel-a), var(--panel-b));
    border:1px solid rgba(255,255,255,.1); border-radius:20px;
    padding:1.8rem 2.4rem; text-align:center; max-width:320px;
    box-shadow:0 24px 60px rgba(0,0,0,.55), 0 0 30px rgba(47,227,255,.12);
    transform:scale(.92); transition:transform .25s ease;
  }
  .confirm-overlay.is-active .confirm-box{transform:scale(1);}
  .confirm-box p{margin:0 0 1.3rem;font-size:.95rem;color:var(--ink);line-height:1.4;}
  .confirm-yes{
    font-family:'Rajdhani', sans-serif; font-weight:600; font-size:1rem; letter-spacing:.02em;
    color:var(--bg); background:linear-gradient(135deg, var(--cyan), var(--cyan-deep));
    border:none; border-radius:999px; padding:.65rem 2.2rem; cursor:pointer;
    box-shadow:0 0 20px rgba(47,227,255,.4); transition:transform .15s ease, box-shadow .15s ease;
  }
  .confirm-yes:hover, .confirm-yes:focus-visible{transform:scale(1.05);box-shadow:0 0 28px rgba(47,227,255,.6);}

  @keyframes hexIn{to{opacity:1;transform:scale(1);}}
  @keyframes dotPulse{0%,100%{opacity:.45;}50%{opacity:1;}}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important;}
  }

  @media (max-width:560px){
    .hex-row{gap:1.4rem;}
    body{overflow-y:auto;}
  }
</style>
</head>
<body>

  <div class="bgfx" aria-hidden="true">
    <div class="bgfx__grid"></div>
    <div class="bgfx__glow bgfx__glow--cyan"></div>
    <div class="bgfx__glow bgfx__glow--magenta"></div>
  </div>

  <main id="home" class="view view--home">
    <div class="hub-header">
      <h1>JMB Headquarter</h1>
      <div class="hud-clock">
        <span class="hud-clock__time" id="hudTime">--:--:--</span>
        <span class="hud-clock__date" id="hudDate">-- --- ----</span>
      </div>
    </div>

    <div class="hex-row">
      <button class="hex hex--cyan" data-target="kalender" type="button">
        <span class="hex__inner">
          <svg class="hex__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="10" width="36" height="32" rx="3"/>
            <line x1="6" y1="19" x2="42" y2="19"/>
            <line x1="15" y1="6" x2="15" y2="14"/>
            <line x1="33" y1="6" x2="33" y2="14"/>
            <circle cx="15" cy="27" r="1.6" fill="currentColor" stroke="none"/>
            <circle cx="24" cy="27" r="1.6" fill="currentColor" stroke="none"/>
            <circle cx="33" cy="27" r="1.6" fill="currentColor" stroke="none"/>
            <circle cx="15" cy="35" r="1.6" fill="currentColor" stroke="none"/>
            <circle cx="24" cy="35" r="1.6" fill="currentColor" stroke="none"/>
          </svg>
          <span class="hex__title">Kalender</span>
          <span class="hex__sub">Termine & Zeitplanung</span>
        </span>
      </button>

      <button class="hex hex--magenta" data-target="journal" type="button">
        <span class="hex__inner">
          <svg class="hex__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="6" x2="12" y2="16"/>
            <rect x="8" y="16" width="8" height="14"/>
            <line x1="12" y1="30" x2="12" y2="41"/>
            <line x1="24" y1="10" x2="24" y2="18"/>
            <rect x="20" y="18" width="8" height="10" fill="currentColor" stroke="none"/>
            <line x1="24" y1="28" x2="24" y2="38"/>
            <line x1="36" y1="4" x2="36" y2="14"/>
            <rect x="32" y="14" width="8" height="16"/>
            <line x1="36" y1="30" x2="36" y2="43"/>
          </svg>
          <span class="hex__title">Trading Journal</span>
          <span class="hex__sub">Trades & Performance</span>
        </span>
      </button>

      <button class="hex hex--violet hex--disabled" id="hexProjekte" type="button">
        <span class="hex__inner">
          <svg class="hex__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 14a3 3 0 0 1 3-3h8l4 5h18a3 3 0 0 1 3 3v16a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V14z"/>
          </svg>
          <span class="hex__title">Projekte</span>
          <span class="hex__sub">Noch nicht verknüpft</span>
        </span>
      </button>
    </div>

    <div class="status-strip">
      <span><span class="status-dot status-dot--cyan"></span>Kalender bereit</span>
      <span><span class="status-dot status-dot--magenta"></span>Journal bereit</span>
      <span><span class="status-dot status-dot--violet"></span>Projekte in Kürze</span>
    </div>
  </main>

  <section id="app" class="view view--app" aria-hidden="true">
    <button class="back-btn" id="backBtn" type="button" aria-label="Zurück zur Startseite">
      <span class="back-btn__inner">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 5 L7 12 L15 19"/>
        </svg>
      </span>
    </button>
    <div class="app-frame-wrap">
      <div class="loader" id="loader">
        <span class="loader__ring"></span>
        <span class="loader__text" id="loaderText">Wird geladen …</span>
      </div>
      <iframe id="appFrame" title="Eingebettete App"></iframe>
    </div>
  </section>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <p>Änderungen speichern?</p>
      <button class="confirm-yes" id="btnConfirmSave" type="button">Ja</button>
    </div>
  </div>

<script>
  const homeView = document.getElementById('home');
  const appView  = document.getElementById('app');
  const frame    = document.getElementById('appFrame');
  const loader   = document.getElementById('loader');
  const loaderText = document.getElementById('loaderText');
  const backBtn  = document.getElementById('backBtn');
  const confirmOverlay = document.getElementById('confirmOverlay');
  const btnConfirmSave = document.getElementById('btnConfirmSave');

  // Alle eingebetteten Apps speichern ihre Änderungen selbst laufend (localStorage bei
  // jeder Aktion) — die "Ja"-Bestätigung ist daher primär eine bewusste Bestätigung des
  // Nutzers und blockiert die Navigation, bis sie angeklickt wird.
  let pendingLeaveAction = null;
  function requestLeaveApp(action){
    pendingLeaveAction = action;
    confirmOverlay.classList.add('is-active');
  }
  btnConfirmSave.addEventListener('click', () => {
    confirmOverlay.classList.remove('is-active');
    const action = pendingLeaveAction; pendingLeaveAction = null;
    if(action) action();
  });

  const targets = {
    kalender: { src: 'kalender-julian.html', label: 'Kalender wird geladen …' },
    journal:  { src: 'trading-journal-julian.html', label: 'Trading Journal wird geladen …' }
  };

  let currentTarget = null;

  function openApp(name, pushHistory){
    const t = targets[name];
    if(!t) return;
    homeView.classList.remove('is-active');
    appView.classList.add('is-active');
    appView.setAttribute('aria-hidden', 'false');
    homeView.setAttribute('aria-hidden', 'true');

    if(currentTarget !== name){
      switchFrameTo(t.src, t.label);
      currentTarget = name;
    }
    if(pushHistory !== false) history.pushState({view:name}, '', '#' + name);
  }

  // Wechselt das iframe auf eine neue App. Vorher wird dem GERADE NOCH geladenen
  // iframe (der alten App) kurz signalisiert, dass dies ein bewusster, gewollter
  // Wechsel ist — verhindert, dass dessen nativer Browser-"Verlassen?"-Dialog
  // nochmal aufploppt, obwohl das eigene Bestätigungs-Modal (Zurück-Button) den
  // Nutzer schon gefragt hat. Da postMessage asynchron zugestellt wird (und unter
  // file:// direkter Cross-Frame-Zugriff ohnehin blockiert ist), wird auf eine
  // kurze Bestätigung der alten App gewartet, bevor wirklich gewechselt wird —
  // mit Timeout-Fallback, falls z.B. beim allerersten Laden noch kein Listener
  // im iframe existiert.
  function switchFrameTo(src, label){
    loaderText.textContent = label;
    loader.classList.add('is-visible');

    let switched = false;
    function doSwitch(){
      if(switched) return;
      switched = true;
      window.removeEventListener('message', onAck);
      frame.src = src;
    }
    function onAck(e){
      if(e.data && e.data.type === 'jmb-suppress-unload-ack') doSwitch();
    }
    window.addEventListener('message', onAck);

    try{ frame.contentWindow && frame.contentWindow.postMessage({type:'jmb-suppress-unload'}, '*'); }
    catch(err){ /* z.B. leeres/erstes iframe ohne Inhalt — Timeout unten übernimmt */ }

    setTimeout(doSwitch, 120);
  }

  function goHome(pushHistory){
    appView.classList.remove('is-active');
    homeView.classList.add('is-active');
    homeView.setAttribute('aria-hidden', 'false');
    appView.setAttribute('aria-hidden', 'true');
    if(pushHistory !== false) history.pushState({view:'home'}, '', '#');
  }

  frame.addEventListener('load', () => {
    loader.classList.remove('is-visible');
  });

  document.querySelectorAll('.hex[data-target]').forEach(btn => {
    btn.addEventListener('click', () => openApp(btn.dataset.target, true));
  });

  backBtn.addEventListener('click', () => requestLeaveApp(() => goHome(true)));

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){
      if(confirmOverlay.classList.contains('is-active')){ return; }
      if(appView.classList.contains('is-active')) requestLeaveApp(() => goHome(true));
    }
  });

  window.addEventListener('popstate', (e) => {
    const view = e.state && e.state.view;
    if(!view || view === 'home') goHome(false);
    else openApp(view, false);
  });

  function tick(){
    const now = new Date();
    document.getElementById('hudTime').textContent =
      now.toLocaleTimeString('de-DE');
    document.getElementById('hudDate').textContent =
      now.toLocaleDateString('de-DE', { weekday:'long', day:'2-digit', month:'2-digit', year:'numeric' });
  }
  tick();
  setInterval(tick, 1000);

  const startHash = location.hash.replace('#', '');
  if(targets[startHash]){
    openApp(startHash, false);
  } else {
    homeView.classList.add('is-active');
  }
</script>
</body>
</html>
